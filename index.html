<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ascending">
<meta name="theme-color" content="#101828">
<title>Ascending</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap">
<style>
:root{--bg:#f3f5f9;--fg:#101828;--mut:#64708a;--card:#fff;--line:#d9dfea;--acc:#c98412;--accfg:#fff;--ok:#23915f;--run:#2f6fdb;--tick:#cdd4e2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101828;--fg:#eef2f8;--mut:#8d99b3;--card:#1a2438;--line:#29344d;--acc:#f2b544;--accfg:#101828;--ok:#2fb47c;--run:#5a9bff;--tick:#2a3552;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101828;--fg:#eef2f8;--mut:#8d99b3;--card:#1a2438;--line:#29344d;--acc:#f2b544;--accfg:#101828;--ok:#2fb47c;--run:#5a9bff;--tick:#2a3552;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 18px 48px}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-weight:300;font-size:2.1rem;letter-spacing:.14em;text-align:center;margin:10px 0 6px}
h2{font-weight:500;font-size:1.5rem;margin:6px 0 2px}
h3{font-weight:500;font-size:1.05rem;margin:26px 0 10px}
.mut{color:var(--mut);margin:0}
.sm{font-size:.85rem;margin:6px 0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back,.menu{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.menu{width:42px;height:38px;padding:0;font-size:1.2rem;line-height:1}
.ring{position:relative;display:block;width:100%;max-width:340px;aspect-ratio:1;margin:14px auto 8px;background:none;border:0;padding:0}
.ring svg{width:100%;height:100%}
.ring line{stroke:var(--tick);stroke-width:1.3;stroke-linecap:round}
.ring line.on{stroke:var(--acc)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring b{font-size:5rem;line-height:1;font-weight:700}
.ring span{color:var(--mut);margin-top:6px;padding:0 50px}
.status{text-align:center;margin:10px 0 22px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--acc);color:var(--accfg);border:0;border-radius:12px;padding:12px 18px;font-weight:500}
.btn.alt{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.big{width:100%;padding:16px;font-size:1.05rem;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid .wd{text-align:center;color:var(--mut);font-size:.8rem;padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--line);position:relative;padding:0;font-size:.95rem}
.cell.done{background:var(--ok);border-color:transparent;color:#fff}
.cell.run{background:var(--run);border-color:transparent;color:#fff}
.cell.today{outline:2px solid var(--acc);outline-offset:2px;font-weight:700}
.cell.has::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc)}
ul{list-style:none;margin:12px 0;padding:0}
li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
li span{flex:1;overflow-wrap:anywhere}
li.d span{color:var(--mut);text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);background:none;padding:0;flex:none;position:relative}
li.d .chk,.chk.on{background:var(--ok);border-color:var(--ok)}
li.d .chk::after,.chk.on::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chk:disabled{cursor:default}
.x,.rp{background:none;border:0;color:var(--mut);font-size:1.3rem;line-height:1;padding:0 4px}
.rp{color:var(--acc)}
.add{display:flex;gap:8px}
.add input[type=text]{flex:1;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.add button{background:var(--acc);color:var(--accfg);border:0;border-radius:12px;padding:0 16px;font-weight:500}
.rep{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.rep select{padding:8px 10px}
.rep span[hidden]{display:none}
.rep input[type=number]{width:70px;padding:8px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips label{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:.9rem;background:var(--card)}
.chips input{display:none}
.chips label:has(input:checked){background:var(--acc);color:var(--accfg);border-color:transparent}
.wk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px 14px;margin-top:14px}
.wk h3{margin:10px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.big-t{font-size:2.3rem;font-weight:700;line-height:1.1;margin:4px 0}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sg .card{margin:0;padding:14px}
.sg b{display:block;font-size:1.25rem;font-weight:500;margin-top:4px}
.bar{height:12px;border-radius:99px;background:var(--tick);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.ms{display:inline-block;min-width:42px;text-align:center;border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin:4px 4px 0 0;color:var(--mut);background:none}
.ms.on{background:var(--acc);color:var(--accfg);border-color:transparent;font-weight:500}
.ch{width:100%;height:auto;margin-top:8px}
.ch rect{fill:var(--acc)}
.ch text{fill:var(--mut);font-size:9px}
.ch polyline{fill:none;stroke:var(--run);stroke-width:2.5;stroke-linejoin:round}
.ch circle{fill:var(--run)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--card);z-index:21;padding:calc(env(safe-area-inset-top,0px) + 20px) 14px 20px;overflow-y:auto;animation:sl .2s ease-out}
@keyframes sl{from{transform:translateX(-100%)}to{transform:none}}
.dt{font-weight:300;font-size:1.5rem;letter-spacing:.14em;margin:6px 8px 14px}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:13px 14px;font-size:1.05rem}
.mi.on{background:var(--bg);color:var(--acc);font-weight:500}
.lst .mi{border-bottom:1px solid var(--line);border-radius:0}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,380px);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;z-index:31}
.modal h3{margin:0 0 8px}
.scrim.m{z-index:30}
.srow{display:grid;grid-template-columns:22px 1fr 1fr 34px;gap:8px;align-items:center;margin-top:8px}
.srow input{width:100%;min-width:0;padding:9px}
.tmbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;align-items:center;z-index:10}
.tmbar span{flex:1;font-size:1.25rem;font-weight:500}
details summary{cursor:pointer;font-weight:500}
textarea{width:100%;min-height:90px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<div id="layer"></div>
<script>
var K='ascending-v1',S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{};
S.start=S.start||null;S.days=S.days||{};S.planned=S.planned||'';S.rec=S.rec||[];S.th=S.th||[];S.ab=S.ab||null;
S.st=S.st||{};S.runs=S.runs||{};S.ws=S.ws||null;
S.wo=S.wo||{};S.wo.plans=S.wo.plans||[];S.wo.logs=S.wo.logs||[];S.wo.pr=S.wo.pr||{};S.wo.custom=S.wo.custom||[];S.wo.rest=S.wo.rest||90;
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var pad=function(n){return String(n).padStart(2,'0')};
var key=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(k){var p=k.split('-');return new Date(+p[0],p[1]-1,+p[2])};
var add=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var today=function(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
var diff=function(a,b){return Math.round((a-b)/864e5)};
var mon=function(d){return add(d,-((d.getDay()+6)%7))};
var full=function(k){var t=S.days[k]||[];return t.length>0&&t.every(function(x){return x.d})};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var f1=function(n){return (Math.round(n*10)/10).toString().replace('.',',')};
var DF=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long'});
var MF=new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'});
var TF=new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
var SF=new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'long'});
var nextThu=function(t){return add(t,(((8-t.getDay())%7)||7)+3)};
var ICON={wo:'💪',run:'🏃',skin:'✨',box:'🥊'};
var PH={skin:'z. B. Gesicht reinigen',box:'Boxworkout',run:'Lauf (z. B. 5 km locker)'};
var DEF={box:'Boxworkout',run:'Lauf'};
var TT={skin:'Face Ascend',box:'Box-Tracker',run:'Laufen',st:'Bildschirmzeit',wo:'Workout'};
var GR=['Bauch','Rücken','Nacken','Schulter','Trizeps','Bizeps','Beine','Waden','Brust','Gesäß'];
var WD='<div class="grid" style="margin-top:16px">'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(function(w){return '<div class="wd">'+w+'</div>'}).join('')+'</div>';

/* ---------- Wiederholungen & Streak ---------- */
function match(r,d){return r.type==='every'?diff(d,parse(r.from))%r.n===0:r.days.indexOf(d.getDay())>-1}
function fillRec(){
  if(!S.rec.length)return;
  var t=today(),end=add(parse(S.start),364);
  for(var d=new Date(t);d<=end;d=add(d,1)){
    var k=key(d);
    S.rec.forEach(function(r){
      if(d<parse(r.from)||r.skip.indexOf(k)>-1||!match(r,d))return;
      var a=S.days[k]=S.days[k]||[];
      if(!a.some(function(x){return x.r===r.id}))a.push({t:r.t,d:false,r:r.id,src:r.src,ref:r.ref});
    });
  }
}
function check(){
  var t=today();
  if(!S.start)S.start=key(nextThu(t));
  var d=parse(S.start);
  while(d<t){
    if(!full(key(d))){var L=diff(d,parse(S.start));if(L>0)S.th.push(L);S.start=key(t);break}
    d=add(d,1);
  }
  fillRec();save();
}
function streak(){var t=today(),s=parse(S.start);if(t<s)return 0;return diff(t,s)+(full(key(t))?1:0)}

var view={n:'home'},focusKey=null,menu=false,modal=false,tmEnd=0,libG='Brust',libQ='',wb={id:null,name:'',exs:[]};

/* ---------- Übungen ---------- */
var BUILT=[],NET=null,exState='';
'Brust:Bankdrücken,Schrägbankdrücken,Kurzhantel-Bankdrücken,Fliegende,Kabelzug-Fliegende,Liegestütze,Dips (Brust),Butterfly-Maschine,Brustpresse;Rücken:Klimmzüge,Latziehen,Rudern vorgebeugt,Kabelrudern,Kreuzheben,T-Bar-Rudern,Einarmiges Kurzhantelrudern,Hyperextensions,Überzüge;Schulter:Schulterdrücken,Seitheben,Frontheben,Reverse Flys,Arnold Press,Face Pulls,Aufrechtes Rudern;Bizeps:Langhantel-Curls,Kurzhantel-Curls,Hammer-Curls,Scott-Curls,Kabel-Curls,Konzentrations-Curls;Trizeps:Trizepsdrücken am Kabel,Skull Crusher,Dips (Trizeps),Enges Bankdrücken,Überkopf-Trizepsstrecken,Kickbacks;Beine:Kniebeugen,Frontkniebeugen,Beinpresse,Ausfallschritte,Rumänisches Kreuzheben,Beinstrecker,Beinbeuger,Bulgarian Split Squats,Hackenschmidt-Kniebeuge,Adduktoren-Maschine,Abduktoren-Maschine;Waden:Wadenheben stehend,Wadenheben sitzend,Wadenheben an der Beinpresse;Bauch:Crunches,Plank,Beinheben hängend,Russian Twists,Bauchroller,Seitlicher Unterarmstütz,Sit-ups,Fahrrad-Crunches,Cable Crunches;Nacken:Nackenheben,Shrugs mit Kurzhanteln,Shrugs mit Langhantel,Nacken-Isometrie;Gesäß:Hip Thrusts,Glute Bridge,Kabel-Kickbacks,Sumo-Kreuzheben,Step-ups,Good Mornings'
.split(';').forEach(function(p){var a=p.split(':');a[1].split(',').forEach(function(n){BUILT.push({n:n,g:[a[0]]})})});
try{NET=JSON.parse(localStorage.getItem('ascending-ex'))}catch(e){}
var MAPG={abdominals:'Bauch','lower back':'Rücken','middle back':'Rücken',lats:'Rücken',neck:'Nacken',traps:'Nacken',shoulders:'Schulter',triceps:'Trizeps',biceps:'Bizeps',forearms:'Bizeps',quadriceps:'Beine',hamstrings:'Beine',abductors:'Beine',adductors:'Beine',calves:'Waden',chest:'Brust',glutes:'Gesäß'};
function loadEx(){
  if(NET||exState)return;
  exState='lädt';
  fetch('https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json').then(function(r){return r.json()}).then(function(j){
    NET=j.map(function(e){var g=[];(e.primaryMuscles||[]).forEach(function(m){var x=MAPG[m];if(x&&g.indexOf(x)<0)g.push(x)});return{n:e.name,g:g}}).filter(function(e){return e.g.length});
    try{localStorage.setItem('ascending-ex',JSON.stringify(NET))}catch(e){}
    exState='';if(view.n==='wlib')render();
  }).catch(function(){exState='offline';if(view.n==='wlib')render()});
}
function allEx(){return BUILT.concat(NET||[],S.wo.custom.map(function(c){return{n:c.n,g:[c.g]}}))}

/* ---------- Bausteine ---------- */
function bar(back){return '<div class="top"><button class="menu" data-act="menu" aria-label="Menü öffnen">☰</button>'+(back||'')+'</div>'}
function backTo(act,s,l){return '<button class="back" data-act="'+act+'" data-s="'+(s||'')+'">'+(l||'Zurück')+'</button>'}
function list(k,edit,tog,src){
  var ts=S.days[k]||[],h='';
  ts.forEach(function(x,i){
    if(src&&x.src!==src)return;
    h+='<li class="'+(x.d?'d':'')+'"><button class="chk" '+(tog?'data-act="toggle" data-k="'+k+'" data-i="'+i+'"':'disabled')+' aria-label="Erledigt"></button><span>'+(x.src?ICON[x.src]+' ':'')+esc(x.t)+'</span>'+
    (tog&&x.src==='wo'&&x.ref&&!x.d?'<button class="rp" data-act="wgo" data-k="'+k+'" data-p="'+x.ref+'" aria-label="Workout starten">▶</button>':'')+
    (edit&&x.r?'<button class="rp" data-act="endrec" data-r="'+x.r+'" aria-label="Wiederholung beenden">↻</button>':'')+
    (edit?'<button class="x" data-act="del" data-k="'+k+'" data-i="'+i+'" aria-label="Löschen">×</button>':'')+'</li>';
  });
  if(!h)return edit?'':'<p class="mut">Keine Einträge.</p>';
  return '<ul>'+h+'</ul>';
}
function adder(k,src){
  src=src||'';
  var wd=parse(k).getDay(),chips=[1,2,3,4,5,6,0].map(function(v,i){
    return '<label><input type="checkbox" value="'+v+'"'+(v===wd?' checked':'')+'>'+['Mo','Di','Mi','Do','Fr','Sa','So'][i]+'</label>';
  }).join('');
  var field;
  if(src==='wo'){
    field=S.wo.plans.length?'<select id="wp-'+k+'" style="flex:1;min-width:0">'+S.wo.plans.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('')+'</select>':'<p class="mut sm" style="flex:1;align-self:center">Erstelle zuerst ein Workout.</p>';
  }else field='<input type="text" id="in-'+k+'" data-s="'+src+'" placeholder="'+(PH[src]||'Neue Aufgabe')+'" maxlength="80" enterkeyhint="done">';
  return '<div class="add">'+field+'<button data-act="add" data-k="'+k+'" data-s="'+src+'">Hinzufügen</button></div>'+
  '<div class="rep"><select id="rt-'+k+'" data-k="'+k+'" aria-label="Wiederholung"><option value="once">Einmalig</option><option value="daily">Jeden Tag</option><option value="every">Alle … Tage</option><option value="wd">An Wochentagen</option></select>'+
  '<span id="re-'+k+'" hidden>alle <input type="number" id="rn-'+k+'" min="2" max="365" value="2"> Tage</span>'+
  '<span id="rw-'+k+'" class="chips" hidden>'+chips+'</span></div>';
}
function card(l,v){return '<div class="card"><span class="mut sm">'+l+'</span><b>'+v+'</b></div>'}
function grid(fn,act,src,from){
  var s=parse(S.start),t=today(),tk=key(t),s0=from||(t<s?t:s),end=add(s,364),cur='',open=false,out=WD;
  for(var d=new Date(s0);d<=end;d=add(d,1)){
    var k=key(d),m=MF.format(d);
    if(m!==cur){if(open)out+='</div>';cur=m;open=true;out+='<h3>'+m+'</h3><div class="grid">';for(var b=0;b<(d.getDay()+6)%7;b++)out+='<div></div>'}
    out+='<button class="cell '+fn(k,d)+(k===tk?' today':'')+'" data-act="'+act+'" data-k="'+k+'" data-s="'+src+'" aria-label="'+DF.format(d)+'">'+d.getDate()+'</button>';
  }
  return out+'</div>';
}
function bars(v,lab){
  var mx=Math.max.apply(null,v.concat([1])),bw=300/v.length;
  return '<svg viewBox="0 0 300 135" class="ch" aria-hidden="true">'+v.map(function(y,i){var h=y/mx*100;return '<rect x="'+(i*bw+2).toFixed(1)+'" y="'+(110-h).toFixed(1)+'" width="'+(bw-4).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3"/>'+(lab[i]?'<text x="'+(i*bw+bw/2).toFixed(1)+'" y="126" text-anchor="middle">'+lab[i]+'</text>':'')}).join('')+'</svg>';
}
function line(v){
  if(v.length<2)return '<p class="mut sm">Ab dem zweiten Eintrag erscheint hier deine Kurve.</p>';
  var mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),r=(mx-mn)||1,p=v.map(function(y,i){return[10+i*(280/(v.length-1)),100-(y-mn)/r*80]});
  return '<svg viewBox="0 0 300 120" class="ch" aria-hidden="true"><polyline points="'+p.map(function(a){return a[0].toFixed(1)+','+a[1].toFixed(1)}).join(' ')+'"/>'+p.map(function(a){return '<circle cx="'+a[0].toFixed(1)+'" cy="'+a[1].toFixed(1)+'" r="3.5"/>'}).join('')+'</svg>';
}
var fm=function(m){m=Math.round(m);return Math.floor(m/60)+' Std. '+m%60+' Min.'};
var pf=function(x){var r=Math.round(x);return Math.floor(r/60)+':'+pad(r%60)};

/* ---------- To-do ---------- */
function home(){
  var t=today(),s=parse(S.start),pre=t<s,n=Math.min(streak(),365),R=118,tk=key(t),ts=S.days[tk]||[],dn=ts.filter(function(x){return x.d}).length,ticks='';
  for(var i=0;i<365;i++){
    var a=i/365*2*Math.PI-Math.PI/2,c=Math.cos(a),sn=Math.sin(a);
    ticks+='<line x1="'+(150+c*(R-10)).toFixed(1)+'" y1="'+(150+sn*(R-10)).toFixed(1)+'" x2="'+(150+c*R).toFixed(1)+'" y2="'+(150+sn*R).toFixed(1)+'" class="'+(i<n?'on':'')+'"/>';
  }
  var cap=pre?'Start am '+SF.format(s):n>=365?'365 Tage geschafft':'von 365 Tagen in Folge';
  var st=pre?'Es geht in '+diff(s,t)+' Tagen los. Plane schon mal vor.':ts.length?'Heute: '+dn+' von '+ts.length+' erledigt':'Für heute ist noch nichts geplant';
  return bar()+'<h1>Ascending</h1>'+
  '<button class="ring" data-act="cal" aria-label="Kalender öffnen, '+n+' von 365 Tagen"><svg viewBox="0 0 300 300" aria-hidden="true">'+ticks+'</svg><div class="c"><b>'+n+'</b><span>'+cap+'</span></div></button>'+
  '<p class="status mut">'+st+'</p>'+

function cal(){

  grid(function(k,d){return d<t||(k===tk&&full(k))?'done':(d>t&&(S.days[k]||[]).length?'has':'')},'day','',s);
}
function day(k){
  var t=today(),tk=key(t),d=parse(k),past=d<t,isT=k===tk,ts=S.days[k]||[],dn=ts.filter(function(x){return x.d}).length,no=diff(d,parse(S.start))+1;

function week(){

function stats(){
  var n=streak(),th=S.th,best=Math.max.apply(null,[n].concat(th)),tk=key(today()),tot=0,dn=0,k;

  '<div class="sg">'+card('Aktuelle Serie',n+' Tage')+card('Längste Serie',best+' Tage')+card('Beendete Serien',th.length)+card('Ø Serie',avg)+card('Erledigte Aufgaben',dn)+card('Erledigungsquote',tot?Math.round(dn/tot*100)+' %':'–')+card('Bis zum Ziel',Math.max(0,365-n)+' Tage')+card('Wiederholungen',S.rec.length)+'</div>'+
  '<div class="card"><span class="mut sm">Startdatum ändern (ab heute möglich)</span><div class="add" style="margin-top:8px"><input type="date" id="sd" value="'+S.start+'" min="'+tk+'"><button data-act="setstart">Speichern</button></div></div>';
}

/* ---------- Abstinenz ---------- */
var MS=[1,3,7,14,30,60,90,180,365];
function dur(ms){var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);return d+(d===1?' Tag ':' Tage ')+h+' Std.'}
function durL(ms){var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);return d+(d===1?' Tag ':' Tagen ')+h+(h===1?' Stunde':' Stunden')}
function ab(){
  var top=bar()+'<h2>Abstinenz-Streak</h2>';
  if(!S.ab){
    var n=new Date(),v=n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())+'T'+pad(n.getHours())+':'+pad(n.getMinutes());
    return top+'<p class="mut">Wann soll dein Streak beginnen?</p><div class="card"><input type="datetime-local" id="abs" value="'+v+'" max="'+v+'" style="width:100%"><button class="btn big" data-act="abstart">Streak starten</button></div>';
  }
  var now=Date.now(),cur=now-S.ab.start,h=S.ab.h||[],lens=h.map(function(x){return x.e-x.s}),best=Math.max.apply(null,[cur].concat(lens)),days=Math.floor(cur/864e5),nx=0;
  for(var i=0;i<MS.length;i++){if(MS[i]>days){nx=MS[i];break}}
  var left=nx?Math.ceil((nx*864e5-cur)/864e5):0,pct=Math.min(100,cur/864e5/365*100);
  var avg=lens.length?dur(lens.reduce(function(a,b){return a+b},0)/lens.length):'–';
  return top+
  '<div class="card"><span class="mut sm">Aktueller Streak</span><div class="big-t">'+dur(cur)+'</div><p class="mut sm">Start: '+TF.format(new Date(S.ab.start))+'</p><p class="mut sm">Längster Streak: '+dur(best)+'</p></div>'+
  '<div class="card"><span class="mut sm">Fortschritt</span><div class="big-t">'+Math.min(days,365)+' / 365 Tage</div><div class="bar"><i style="width:'+pct+'%"></i></div>'+
  '<p class="mut sm">'+(nx?left+(left===1?' Tag':' Tage')+' bis zum nächsten Meilenstein ('+nx+' Tage)':'Alle Meilensteine erreicht')+'</p>'+
  '<div style="margin-top:8px">'+MS.map(function(m){return '<span class="ms'+(days>=m?' on':'')+'">'+m+'</span>'}).join('')+'</div><p class="mut sm">Meilensteine in Tagen</p></div>'+
  '<div class="sg">'+card('Durchschnittlicher Streak',avg)+card('Abgeschlossene Streaks',h.length)+card('Längster Streak',dur(best))+card('Zeit seit letztem Reset',h.length?dur(now-h[h.length-1].e):'Noch kein Reset')+'</div>'+
  '<button class="btn alt big" data-act="abreset">Streak zurücksetzen</button>';
}

/* ---------- Bildschirmzeit ---------- */
function stForm(k){
  var v=S.st[k],h=v!=null?Math.floor(v/60):'',m=v!=null?v%60:'';
  return '<div class="card"><span class="mut sm">Bildschirmzeit'+(v!=null?': '+fm(v):'')+'</span><div class="rep"><input type="number" id="sh" min="0" max="24" inputmode="numeric" placeholder="Std." value="'+h+'"><input type="number" id="sm" min="0" max="59" inputmode="numeric" placeholder="Min." value="'+m+'"><button class="btn" data-act="stsave" data-k="'+k+'">Speichern</button>'+(v!=null?'<button class="back" data-act="stdel" data-k="'+k+'">Löschen</button>':'')+'</div></div>';
}
function stSum(a,b){var s=0,c=0;for(var d=new Date(a);d<=b;d=add(d,1)){var v=S.st[key(d)];if(v!=null){s+=v;c++}}return{s:s,c:c}}
function smain(){
  var t=today(),w0=mon(t),w=stSum(w0,add(w0,6)),lw=stSum(add(w0,-7),add(w0,-1)),m0=new Date(t.getFullYear(),t.getMonth(),1),mo=stSum(m0,new Date(t.getFullYear(),t.getMonth()+1,0)),l7=stSum(add(t,-6),t),tot=0,all=Object.keys(S.st);
  all.forEach(function(k){tot+=S.st[k]});
  var av=function(o){return o.c?fm(o.s/o.c):'–'},v=[],lab=[];
  for(var i=13;i>=0;i--){var d=add(t,-i),x=S.st[key(d)];v.push(x||0);lab.push(i%2===0?d.getDate():'')}
  return bar()+'<h2>Bildschirmzeit</h2><p class="mut">Heute eintragen</p>'+stForm(key(t))+
  '<div class="row" style="margin-top:14px"><button class="btn alt" data-act="cal2" data-s="st">Kalender</button></div>'+
  '<h3>Statistiken</h3><div class="sg">'+card('Diese Woche gesamt',fm(w.s))+card('Ø pro Tag (Woche)',av(w))+card('Dieser Monat gesamt',fm(mo.s))+card('Ø pro Tag (Monat)',av(mo))+card('Letzte Woche gesamt',fm(lw.s))+card('Ø letzte 7 Tage',av(l7))+card('Gesamt erfasst',fm(tot))+card('Erfasste Tage',all.length)+'</div>'+
  '<div class="card"><span class="mut sm">Letzte 14 Tage</span>'+bars(v,lab)+'</div>';
}

/* ---------- Laufen ---------- */
function runForm(k){
  var r=S.runs[k],mi=r?Math.floor(r.s/60):'',se=r?r.s%60:'';
  return '<div class="card"><span class="mut sm">'+(r?'Lauf: '+f1(r.km)+' km in '+pf(r.s)+' ('+pf(r.s/r.km)+' min/km)':'Lauf eintragen')+'</span><div class="rep"><input type="text" id="rk" inputmode="decimal" placeholder="km" value="'+(r?r.km:'')+'" style="width:80px"><input type="number" id="rm" min="0" inputmode="numeric" placeholder="Min." value="'+mi+'"><input type="number" id="rs" min="0" max="59" inputmode="numeric" placeholder="Sek." value="'+se+'"></div><div class="rep"><button class="btn" data-act="runsave" data-k="'+k+'">Speichern</button>'+(r?'<button class="back" data-act="rundel" data-k="'+k+'">Löschen</button>':'')+'</div></div>';
}
function runStats(){
  var ks=Object.keys(S.runs).sort(),n=ks.length;
  if(!n)return '<p class="mut" style="margin-top:20px">Noch keine Läufe eingetragen. Nach dem ersten Lauf erscheinen hier Statistiken und dein Fortschritt.</p>';
  var t=today(),w0=mon(t),km=0,sc=0,best=1e9,lg=0,wk=0,mo=0;
  ks.forEach(function(k){var r=S.runs[k],d=parse(k);km+=r.km;sc+=r.s;best=Math.min(best,r.s/r.km);lg=Math.max(lg,r.km);if(d>=w0&&d<=add(w0,6))wk+=r.km;if(d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear())mo+=r.km});
  var sp=ks.map(function(k){return S.runs[k].km/(S.runs[k].s/3600)}),tr='Ab 4 Läufen siehst du hier deinen Trend.';
  if(n>=4){
    var h=Math.floor(n/2),a=sp.slice(0,h),b=sp.slice(-h),av=function(x){return x.reduce(function(p,q){return p+q},0)/x.length},df=av(b)-av(a);
    tr=Math.abs(df)<0.1?'Dein Tempo ist etwa gleich geblieben.':'Im Schnitt bist du '+f1(Math.abs(df))+' km/h '+(df>0?'schneller':'langsamer')+' als am Anfang.';
  }
  return '<h3>Statistiken</h3><div class="sg">'+card('Läufe',n)+card('Gesamt',f1(km)+' km')+card('Ø pro Lauf',f1(km/n)+' km')+card('Ø Tempo',pf(sc/km)+' min/km')+card('Bestes Tempo',pf(best)+' min/km')+card('Längster Lauf',f1(lg)+' km')+card('Diese Woche',f1(wk)+' km')+card('Dieser Monat',f1(mo)+' km')+'</div>'+
  '<div class="card"><span class="mut sm">Fortschritt: Tempo in km/h (höher = besser)</span>'+line(sp.slice(-20))+'<p class="mut sm">'+tr+'</p></div>';
}
function rmain(){
  var tk=key(today());

/* ---------- Kalender & Tage der Tracker ---------- */
function cal2(s){
  var fn,leg;
  if(s==='st'){fn=function(k){return S.st[k]!=null?'run':''};leg='Blau = Bildschirmzeit eingetragen'}
  else if(s==='run'){fn=function(k){var ts=(S.days[k]||[]).filter(function(x){return x.src==='run'});return S.runs[k]?'run':ts.length?'has':''};leg='Blau = gelaufen, Punkt = Lauf geplant'}
  else if(s==='wo'){fn=function(k){var ts=(S.days[k]||[]).filter(function(x){return x.src==='wo'});return S.wo.logs.some(function(l){return l.k===k})?'done':ts.length?'has':''};leg='Grün = trainiert, Punkt = Workout geplant'}
  else{fn=function(k){var ts=(S.days[k]||[]).filter(function(x){return x.src===s});return ts.length&&ts.every(function(x){return x.d})?'done':ts.length?'has':''};leg='Grün = alles erledigt, Punkt = geplant'}
  return bar(backTo('main',s))+'<h2>'+TT[s]+' · Kalender</h2><p class="mut sm">'+leg+'</p>'+grid(fn,'day2',s);
}
function day2(){
  var s=view.s,k=view.k,d=parse(k),t=today(),past=d<t,isT=k===key(t),fut=d>t,out=bar(backTo('cal2',s,'Kalender'))+'<h2>'+DF.format(d)+'</h2>';
  if(s==='st')return out+(fut?'<p class="mut">Für kommende Tage kann noch keine Bildschirmzeit eingetragen werden.</p>':stForm(k));
  if(s==='run')return out+(fut?'':runForm(k))+'<h3>Geplant</h3>'+list(k,!past,isT,'run')+(past?'':adder(k,'run'));
  if(s==='wo'){
    var L=S.wo.logs.filter(function(l){return l.k===k});
    return out+'<h3>Geplant</h3>'+list(k,!past,isT,'wo')+(past?'':adder(k,'wo'))+(L.length?'<h3>Absolviert</h3>'+L.map(function(l){return '<div class="card"><b>'+esc(l.name)+'</b>'+l.ex.map(function(e){return '<p class="mut sm"><span style="color:var(--fg)">'+esc(e.n)+'</span><br>'+e.sets.map(function(x){return x.w+' kg × '+x.r}).join(' · ')+'</p>'}).join('')+'</div>'}).join(''):'');
  }
  return out+list(k,!past,isT,s)+(past?'':adder(k,s));
}
function mainv(){var s=view.s;return s==='st'?smain():s==='wo'?wmain():s==='run'?rmain():tmain(s)}

/* ---------- Menü, Rendern ---------- */
function sec(){var n=view.n;if(n==='ab'||n==='stats')return n;if(view.s)return view.s;if(['wplan','wlib','wex','wgo','wstats'].indexOf(n)>-1)return 'wo';return 'td'}
function layer(){
  var h='';
  if(menu){
    var c=sec();
    h+='<div class="scrim" data-act="menuclose"></div><nav class="drawer"><p class="dt">Ascending</p>'+
    [['td','To-do-Kalender','home'],['stats','To-do-Statistiken','stats'],['ab','Abstinenz-Streak','ab'],['st','Bildschirmzeit','main:st'],['wo','Workout','main:wo'],['run','Laufen','main:run'],['skin','Face Ascend','main:skin'],['box','Box-Tracker','main:box']].map(function(m){
      return '<button class="mi'+(c===m[0]?' on':'')+'" data-act="nav" data-v="'+m[2]+'">'+m[1]+'</button>';
    }).join('')+'</nav>';
  }
  if(modal&&S.ab){
    h+='<div class="scrim m" data-act="mclose"></div><div class="modal" role="dialog"><h3>Bist du sicher?</h3><p class="mut">Dein aktueller Streak von '+durL(Date.now()-S.ab.start)+' wird beendet.</p><div class="row" style="margin-top:16px"><button class="btn alt" data-act="mclose">Abbrechen</button><button class="btn" data-act="mdo">Zurücksetzen</button></div></div>';
  }
  $('layer').innerHTML=h;
}
function tick(){
  var e=$('tm');if(!e||!tmEnd)return;
  var r=Math.ceil((tmEnd-Date.now())/1000);
  if(r<=0){tmEnd=0;e.textContent='Pause vorbei!';try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(x){}}
  else e.textContent='Pause '+Math.floor(r/60)+':'+pad(r%60);
}
function render(){
  check();
  if(view.n==='wgo'&&!S.ws)view={n:'main',s:'wo'};
  var v=view.n,h=v==='cal'?cal():v==='day'?day(view.k):v==='week'?week():v==='stats'?stats():v==='ab'?ab():v==='main'?mainv():v==='cal2'?cal2(view.s):v==='day2'?day2():v==='wplan'?wplan():v==='wlib'?wlib():v==='wex'?wex():v==='wgo'?wgo():v==='wstats'?wstats():home();
  $('app').innerHTML=h;
  layer();tick();
  if(focusKey){var e=$('in-'+focusKey);if(e)e.focus();focusKey=null}
}

/* ---------- Aktionen ---------- */
function addTask(k,src){
  src=src||'';
  var v='',ref;
  if(src==='wo'){var sel=$('wp-'+k),p=sel&&planById(sel.value);if(p){v=p.name;ref=p.id}}
  else{var el=$('in-'+k);v=el?el.value.trim():'';if(!v)v=DEF[src]||''}
  if(v){
    var ty=$('rt-'+k).value;
    if(ty==='once'){(S.days[k]=S.days[k]||[]).push({t:v,d:false,src:src||undefined,ref:ref})}
    else{
      var r={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:v,from:k,skip:[],src:src||undefined,ref:ref};
      if(ty==='wd'){
        r.type='wd';
        r.days=[].slice.call(document.querySelectorAll('#rw-'+k+' input:checked')).map(function(x){return +x.value});
        if(!r.days.length)r.days=[parse(k).getDay()];
      }else{
        r.type='every';
        r.n=ty==='daily'?1:Math.max(1,Math.min(365,Math.round(+$('rn-'+k).value)||2));
      }
      S.rec.push(r);
    }
    save();
  }
  focusKey=k;
}
function markDone(k,src,ref,title){
  var a=S.days[k]=S.days[k]||[],f=false;
  a.forEach(function(x){if(x.src===src&&(!ref||x.ref===ref)){x.d=true;f=true}});
  if(!f)a.push({t:title,d:true,src:src,ref:ref||undefined});
}
function startWo(k,pid){
  var p=planById(pid);if(!p)return;
  S.ws={k:k,pid:pid,name:p.name,exs:p.exs.map(function(e){
    var last=null,pr=S.wo.pr[e.n];
    S.wo.logs.forEach(function(l){l.ex.forEach(function(x){if(x.n===e.n&&x.sets.length)last=x.sets[x.sets.length-1].w})});
    var w=last!=null?last:pr?pr.w:'',sets=[];
    for(var i=0;i<e.s;i++)sets.push({w:w,r:e.r,d:false});
    return{n:e.n,sets:sets};
  })};
  view={n:'wgo'};tmEnd=0;save();
}
function finishWo(){
  var w=S.ws,ex=[];
  w.exs.forEach(function(e){
    var sets=e.sets.filter(function(s){return s.d&&+s.r>0}).map(function(s){return{w:+s.w||0,r:+s.r}});
    if(sets.length)ex.push({n:e.n,sets:sets});
  });
  if(!ex.length){alert('Hake mindestens einen Satz ab.');return false}
  S.wo.logs.push({k:w.k,pid:w.pid,name:w.name,ex:ex});
  ex.forEach(function(e){e.sets.forEach(function(s){if(better(s,S.wo.pr[e.n]))S.wo.pr[e.n]={w:s.w,r:s.r}})});
  markDone(w.k,'wo',w.pid,w.name);
  view={n:'day2',s:'wo',k:w.k};S.ws=null;tmEnd=0;save();
  return true;
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  var D=b.dataset,a=D.act,k=D.k,i=+D.i,nav=true,s=D.s;
  if(a==='home')view={n:'home'};
  else if(a==='cal')view={n:'cal'};
  else if(a==='day')view={n:'day',k:k};
  else if(a==='week')view={n:'week'};
  else if(a==='stats')view={n:'stats'};
  else if(a==='weekdone'){S.planned=key(today());save();view={n:'home'}}
  else if(a==='menu'){menu=true;nav=false}
  else if(a==='menuclose'){menu=false;nav=false}
  else if(a==='nav'){
    var v=D.v;menu=false;
    if(v.indexOf('main:')===0){view={n:'main',s:v.slice(5)};if(v==='main:wo')loadEx()}else view={n:v};
  }
  else if(a==='main')view={n:'main',s:s};
  else if(a==='cal2')view={n:'cal2',s:s};
  else if(a==='day2')view={n:'day2',s:s,k:k};
  else if(a==='toggle'){S.days[k][i].d=!S.days[k][i].d;save();nav=false}
  else if(a==='del'){
    var x=S.days[k][i];
    if(x.r){var r=S.rec.filter(function(y){return y.id===x.r})[0];if(r)r.skip.push(k)}
    S.days[k].splice(i,1);save();nav=false;
  }
  else if(a==='endrec'){
    nav=false;
    if(confirm('Diese Wiederholung für alle kommenden Tage beenden?')){
      var id=D.r,tk=key(today());
      S.rec=S.rec.filter(function(y){return y.id!==id});
      for(var d in S.days){if(d>=tk)S.days[d]=S.days[d].filter(function(y){return y.r!==id||y.d})}
      save();
    }
  }
  else if(a==='add'){addTask(k,s);nav=false}
  else if(a==='setstart'){nav=false;var sv=$('sd').value;if(sv&&sv>=key(today())){S.start=sv;save()}}
  else if(a==='abstart'){nav=false;var ms=new Date($('abs').value).getTime();if(!ms||ms>Date.now())ms=Date.now();S.ab={start:ms,h:[]};save()}
  else if(a==='abreset'){modal=true;nav=false}
  else if(a==='mclose'){modal=false;nav=false}
  else if(a==='mdo'){var n=Date.now();S.ab.h=S.ab.h||[];S.ab.h.push({s:S.ab.start,e:n});S.ab.start=n;save();modal=false;nav=false}
  else if(a==='stsave'){
    nav=false;var sh=$('sh').value,sm=$('sm').value;
    if(sh!==''||sm!==''){S.st[k]=Math.max(0,(+sh||0)*60+(+sm||0));save()}
  }
  else if(a==='stdel'){delete S.st[k];save();nav=false}
  else if(a==='runsave'){
    nav=false;var km=parseFloat($('rk').value.replace(',','.')),sc=(+$('rm').value||0)*60+(+$('rs').value||0);
    if(km>0&&sc>0){S.runs[k]={km:km,s:sc};markDone(k,'run','','Lauf');save()}else alert('Bitte km und Zeit eintragen.');
  }
  else if(a==='rundel'){delete S.runs[k];save();nav=false}
  else if(a==='wnew'){wb={id:null,name:'',exs:[]};view={n:'wplan'}}
  else if(a==='wedit'){var p=planById(D.id);wb={id:p.id,name:p.name,exs:p.exs.map(function(y){return{n:y.n,s:y.s,r:y.r}})};view={n:'wplan'}}
  else if(a==='wdelplan'){nav=false;if(confirm('Dieses Workout löschen?')){S.wo.plans=S.wo.plans.filter(function(y){return y.id!==D.id});save()}}
  else if(a==='wplan')view={n:'wplan'};
  else if(a==='wxdel'){wb.exs.splice(i,1);nav=false}
  else if(a==='wpick'){view={n:'wlib',pick:true};loadEx()}
  else if(a==='wlib'){view={n:'wlib'};loadEx()}
  else if(a==='wlibgo')view={n:'wlib'};
  else if(a==='wg'){libG=D.g;libQ='';nav=false}
  else if(a==='wsel'){
    if(view.pick){wb.exs.push({n:D.n,s:3,r:10});view={n:'wplan'}}else view={n:'wex',x:D.n};
  }
  else if(a==='wcustom'){
    nav=false;var cn=$('cn').value.trim();
    if(cn){S.wo.custom.push({n:cn,g:$('cg').value});save();libQ=cn.toLowerCase();libG=$('cg').value}
  }
  else if(a==='wimport'){
    nav=false;
    try{
      var arr=JSON.parse($('ci').value),c=0;
      arr.forEach(function(o){
        var n2=String(o.name||o.n||'').trim(),g=String(o.gruppe||o.g||'').trim(),gg=GR.filter(function(q){return q.toLowerCase()===g.toLowerCase()})[0];
        if(n2&&gg){S.wo.custom.push({n:n2,g:gg});c++}
      });
      save();alert(c+' Übungen importiert.');
    }catch(err){alert('Das Format passt nicht. Erwartet wird eine Liste wie [{"name":"Bankdrücken","gruppe":"Brust"}].')}
  }
  else if(a==='prsave'){
    nav=false;var pw=$('pw').value,pr=$('pr').value;
    if(pw!==''&&pr!==''){S.wo.pr[D.n]={w:+pw,r:+pr};save()}
  }
  else if(a==='wsave'){
    nav=false;
    if(!wb.name.trim()||!wb.exs.length){alert('Gib einen Namen ein und füge mindestens eine Übung hinzu.')}
    else{
      if(wb.id){var q=planById(wb.id);q.name=wb.name.trim();q.exs=wb.exs}
      else S.wo.plans.push({id:'p'+Date.now().toString(36),name:wb.name.trim(),exs:wb.exs});
      save();view={n:'main',s:'wo'};nav=true;
    }
  }
  else if(a==='wgo'){startWo(k,D.p)}
  else if(a==='wset'){
    nav=false;var st=S.ws.exs[+D.ei].sets[+D.si];st.d=!st.d;
    if(st.d)tmEnd=Date.now()+S.wo.rest*1000;else tmEnd=0;
    save();
  }
  else if(a==='wadd'){nav=false;var ee=S.ws.exs[+D.ei],ls=ee.sets[ee.sets.length-1];ee.sets.push({w:ls?ls.w:'',r:ls?ls.r:10,d:false});save()}
  else if(a==='wfinish'){nav=finishWo()}
  else if(a==='wcancel'){nav=false;if(confirm('Workout abbrechen? Die Eingaben gehen verloren.')){S.ws=null;tmEnd=0;save();view={n:'main',s:'wo'};nav=true}}
  else if(a==='tmp'){nav=false;if(tmEnd)tmEnd+=15000}
  else if(a==='tmm'){nav=false;if(tmEnd)tmEnd-=15000}
  else if(a==='tmstop'){nav=false;tmEnd=0;var te=$('tm');if(te)te.textContent='Pause bereit'}
  else if(a==='wstats')view={n:'wstats'};
  render();
  if(nav)window.scrollTo(0,0);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.matches('.add input[type=text]')){addTask(e.target.id.slice(3),e.target.dataset.s);render()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches('select[data-k]')){var k=t.dataset.k,v=t.value;$('re-'+k).hidden=v!=='every';$('rw-'+k).hidden=v!=='wd'}
  else if(t.id==='rest'){S.wo.rest=+t.value;save()}
});
document.addEventListener('input',function(e){
  var t=e.target,d=t.dataset;
  if(t.id==='pn')wb.name=t.value;
  else if(d.f&&d.i!=null)wb.exs[+d.i][d.f]=Math.max(1,Math.round(+t.value)||1);
  else if(d.f&&d.ei!=null){S.ws.exs[+d.ei].sets[+d.si][d.f]=t.value===''?'':+t.value;save()}
  else if(t.id==='wq'){libQ=t.value.toLowerCase();$('wl').innerHTML=libList()}
});
document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
setInterval(function(){if(view.n==='ab'&&S.ab&&!modal&&!menu)render()},30000);
setInterval(tick,500);

check();
var tk0=key(today());
if(S.ws&&S.ws.k===tk0)view={n:'wgo'};
else{S.ws=null;if(today().getDay()===0&&S.planned!==tk0)view={n:'week'}}
render();
</script>
</body>
</html>
