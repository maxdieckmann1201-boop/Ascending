<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Ascending</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap">
<style>
:root{--bg:#f3f5f9;--fg:#101828;--mut:#64708a;--card:#fff;--line:#d9dfea;--acc:#c98412;--accfg:#fff;--ok:#23915f;--run:#2f6fdb;--tick:#cdd4e2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101828;--fg:#eef2f8;--mut:#8d99b3;--card:#1a2438;--line:#29344d;--acc:#f2b544;--accfg:#101828;--ok:#2fb47c;--run:#5a9bff;--tick:#2a3552;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101828;--fg:#eef2f8;--mut:#8d99b3;--card:#1a2438;--line:#29344d;--acc:#f2b544;--accfg:#101828;--ok:#2fb47c;--run:#5a9bff;--tick:#2a3552;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 18px 48px}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-weight:300;font-size:2.1rem;letter-spacing:.14em;text-align:center;margin:10px 0 6px}
h2{font-weight:500;font-size:1.5rem;margin:6px 0 2px}
h3{font-weight:500;font-size:1.05rem;margin:26px 0 10px}
.mut{color:var(--mut);margin:0}
.sm{font-size:.85rem;margin:6px 0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back,.menu{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.menu{width:42px;height:38px;padding:0;font-size:1.2rem;line-height:1}
.ring{position:relative;display:block;width:100%;max-width:340px;aspect-ratio:1;margin:14px auto 8px;background:none;border:0;padding:0}
.ring svg{width:100%;height:100%}
.ring line{stroke:var(--tick);stroke-width:1.3;stroke-linecap:round}
.ring line.on{stroke:var(--acc)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring b{font-size:5rem;line-height:1;font-weight:700}
.ring span{color:var(--mut);margin-top:6px;padding:0 50px}
.status{text-align:center;margin:10px 0 22px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--acc);color:var(--accfg);border:0;border-radius:12px;padding:12px 18px;font-weight:500}
.btn.alt{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.big{width:100%;padding:16px;font-size:1.05rem;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid .wd{text-align:center;color:var(--mut);font-size:.8rem;padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--line);position:relative;padding:0;font-size:.95rem}
.cell.done{background:var(--ok);border-color:transparent;color:#fff}
.cell.run{background:var(--run);border-color:transparent;color:#fff}
.cell.today{outline:2px solid var(--acc);outline-offset:2px;font-weight:700}
.cell.has::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc)}
ul{list-style:none;margin:12px 0;padding:0}
li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
li span{flex:1;overflow-wrap:anywhere}
li.d span{color:var(--mut);text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);background:none;padding:0;flex:none;position:relative}
li.d .chk,.chk.on{background:var(--ok);border-color:var(--ok)}
li.d .chk::after,.chk.on::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chk:disabled{cursor:default}
.x,.rp{background:none;border:0;color:var(--mut);font-size:1.3rem;line-height:1;padding:0 4px}
.rp{color:var(--acc)}
.add{display:flex;gap:8px}
.add input[type=text]{flex:1;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.add button{background:var(--acc);color:var(--accfg);border:0;border-radius:12px;padding:0 16px;font-weight:500}
.rep{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.rep select{padding:8px 10px}
.rep span[hidden]{display:none}
.rep input[type=number]{width:70px;padding:8px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips label{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:.9rem;background:var(--card)}
.chips input{display:none}
.chips label:has(input:checked){background:var(--acc);color:var(--accfg);border-color:transparent}
.wk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px 14px;margin-top:14px}
.wk h3{margin:10px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.big-t{font-size:2.3rem;font-weight:700;line-height:1.1;margin:4px 0}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sg .card{margin:0;padding:14px}
.sg b{display:block;font-size:1.25rem;font-weight:500;margin-top:4px}
.bar{height:12px;border-radius:99px;background:var(--tick);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.ms{display:inline-block;min-width:42px;text-align:center;border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin:4px 4px 0 0;color:var(--mut);background:none}
.ms.on{background:var(--acc);color:var(--accfg);border-color:transparent;font-weight:500}
.sd{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;background:var(--card)}.sd summary{cursor:pointer;font-weight:600}.sd ul{margin:6px 0 10px 18px;padding:0}.sd li{margin:3px 0}
.exi{display:flex;gap:8px;margin:10px 0}.exi img{width:50%;min-width:0;border-radius:12px;background:var(--card)}
.rt{display:flex;gap:6px;flex-wrap:wrap}
.ch{width:100%;height:auto;margin-top:8px}
.ch rect{fill:var(--acc)}
.ch text{fill:var(--mut);font-size:9px}
.ch line.tr{stroke:var(--acc);stroke-width:2;stroke-dasharray:5 4}
.ch polyline{fill:none;stroke:var(--run);stroke-width:2.5;stroke-linejoin:round}
.ch circle{fill:var(--run)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--card);z-index:21;padding:calc(env(safe-area-inset-top,0px) + 20px) 14px 20px;overflow-y:auto;animation:sl .2s ease-out}
@keyframes sl{from{transform:translateX(-100%)}to{transform:none}}
.dt{font-weight:300;font-size:1.5rem;letter-spacing:.14em;margin:6px 8px 14px}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:13px 14px;font-size:1.05rem}
.mi.on{background:var(--bg);color:var(--acc);font-weight:500}
.lst .mi{border-bottom:1px solid var(--line);border-radius:0}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,380px);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;z-index:31}
.modal h3{margin:0 0 8px}
.scrim.m{z-index:30}
.srow{display:grid;grid-template-columns:22px 1fr 1fr 34px;gap:8px;align-items:center;margin-top:8px}
.srow input{width:100%;min-width:0;padding:9px}
.tmbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;align-items:center;z-index:10}
.tmbar span{flex:1;font-size:1.25rem;font-weight:500}
details summary{cursor:pointer;font-weight:500}
textarea{width:100%;min-height:90px}
:root{--bad:#d6453d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bad:#ff6b63}}
:root[data-theme="dark"]{--bad:#ff6b63}
.bad{color:var(--bad)}
small.bad{font-size:.75rem}
#game{display:none;position:fixed;inset:0;background:#000;z-index:40;color:#fff;user-select:none;-webkit-user-select:none}
.ghud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:14px;right:14px;display:flex;justify-content:space-between;font-size:1.3rem;z-index:2;pointer-events:none}
#gf{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);top:calc(env(safe-area-inset-top,0px) + 56px)}
.dot{position:absolute;border-radius:50%;background:#e5202e;touch-action:none}
.gend{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.bjf{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--accfg);font-size:1.5rem;z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.bjf.up{bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
.bjf.on{box-shadow:0 0 0 4px var(--ok)}
.bjf.hot{box-shadow:0 0 0 4px var(--bad)}
.bjf[hidden],.bjs[hidden],#bjset[hidden]{display:none}
.bjs{position:fixed;left:0;right:0;bottom:0;height:78vh;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;z-index:35;display:flex;flex-direction:column;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.bjh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bjb{display:flex;gap:6px}
.bjb button{border:1px solid var(--line);background:none;border-radius:999px;width:40px;height:36px;font-size:1.05rem;padding:0}
.bjb button.on{background:var(--ok);color:#fff;border-color:transparent}
.bjl{flex:1;overflow-y:auto;margin:10px 0}
.bm{max-width:86%;padding:9px 12px;border-radius:14px;margin:6px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.bm.me{margin-left:auto;background:var(--acc);color:var(--accfg)}
.bm.bot{background:var(--bg)}
.bjin{display:flex;gap:8px}
.bjin input{flex:1;min-width:0}
.bjin button{border:0;border-radius:12px;background:var(--acc);color:var(--accfg);width:46px;font-size:1.1rem}
.bjin button.rec{background:var(--bad);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<div id="layer"></div>
<div id="game"></div>
<div id="bj"></div>
<script>
var K='ascending-v1',S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{};
S.start=S.start||null;S.days=S.days||{};S.planned=S.planned||'';S.rec=S.rec||[];S.th=S.th||[];S.ab=S.ab||null;
S.st=S.st||{};S.runs=S.runs||{};S.goal=S.goal||365;S.hide=S.hide||{};S.nail=S.nail||{};S.ws=S.ws||null;
S.wo=S.wo||{};S.wo.plans=S.wo.plans||[];S.wo.logs=S.wo.logs||[];S.wo.pr=S.wo.pr||{};S.wo.custom=S.wo.custom||[];S.wo.rate=S.wo.rate||{};S.wo.rest=S.wo.rest||90;
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var pad=function(n){return String(n).padStart(2,'0')};
var key=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(k){var p=k.split('-');return new Date(+p[0],p[1]-1,+p[2])};
var add=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var today=function(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
var diff=function(a,b){return Math.round((a-b)/864e5)};
var mon=function(d){return add(d,-((d.getDay()+6)%7))};
var full=function(k){var t=S.days[k]||[];return t.length>0&&t.every(function(x){return x.d})};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var f1=function(n){return (Math.round(n*10)/10).toString().replace('.',',')};
var DF=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long'});
var MF=new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'});
var TF=new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
var SF=new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'long'});
var nextThu=function(t){return add(t,(((8-t.getDay())%7)||7)+3)};
var GOAL=function(){return Math.max(1,Math.round(+S.goal)||365)};
var ICON={wo:'💪',run:'🏃',skin:'✨',box:'🥊',food:'🍽',supp:'💊'};
var PH={skin:'z. B. Gesicht reinigen',box:'Boxworkout',run:'Lauf (z. B. 5 km locker)',supp:'z. B. Magnesium'};
var DEF={box:'Boxworkout',run:'Lauf'};
var TT={nail:'Nägelkauen',skin:'Face Ascend',box:'Box-Tracker',run:'Laufen',st:'Bildschirmzeit',wo:'Workout',food:'Ernährung',supp:'Supplements'};
var GR=['Bauch','Rücken','Nacken','Schulter','Trizeps','Bizeps','Beine','Waden','Brust','Gesäß'];
var WD='<div class="grid" style="margin-top:16px">'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(function(w){return '<div class="wd">'+w+'</div>'}).join('')+'</div>';

/* ---------- Wiederholungen & Streak ---------- */
function match(r,d){return r.type==='every'?diff(d,parse(r.from))%r.n===0:r.days.indexOf(d.getDay())>-1}
function fillRec(){
  if(!S.rec.length)return;
  var t=today(),end=add(parse(S.start),GOAL()-1);
  for(var d=new Date(t);d<=end;d=add(d,1)){
    var k=key(d);
    S.rec.forEach(function(r){
      if(d<parse(r.from)||r.skip.indexOf(k)>-1||!match(r,d))return;
      var a=S.days[k]=S.days[k]||[];
      if(!a.some(function(x){return x.r===r.id}))a.push({t:r.t,d:false,r:r.id,src:r.src,ref:r.ref,tm:r.tm});
    });
  }
}
function check(){
  var t=today();
  if(!S.start)S.start=key(nextThu(t));
  var d=parse(S.start);
  while(d<t){
    if(!full(key(d))){var L=diff(d,parse(S.start));if(L>0)S.th.push(L);S.start=key(t);break}
    d=add(d,1);
  }
  fillRec();foodSync();save();
}
function streak(){var t=today(),s=parse(S.start);if(t<s)return 0;return diff(t,s)+(full(key(t))?1:0)}

var view={n:'home'},focusKey=null,menu=false,modal=false,tmEnd=0,libG='Brust',libQ='',wb={id:null,name:'',exs:[]};

/* ---------- Übungen ---------- */
var BUILT=[],NET=null,exState='';
'Brust:Bankdrücken,Schrägbankdrücken,Kurzhantel-Bankdrücken,Fliegende,Kabelzug-Fliegende,Liegestütze,Dips (Brust),Butterfly-Maschine,Brustpresse;Rücken:Klimmzüge,Latziehen,Rudern vorgebeugt,Kabelrudern,Kreuzheben,T-Bar-Rudern,Einarmiges Kurzhantelrudern,Hyperextensions,Überzüge;Schulter:Schulterdrücken,Seitheben,Frontheben,Reverse Flys,Arnold Press,Face Pulls,Aufrechtes Rudern;Bizeps:Langhantel-Curls,Kurzhantel-Curls,Hammer-Curls,Scott-Curls,Kabel-Curls,Konzentrations-Curls;Trizeps:Trizepsdrücken am Kabel,Skull Crusher,Dips (Trizeps),Enges Bankdrücken,Überkopf-Trizepsstrecken,Kickbacks;Beine:Kniebeugen,Frontkniebeugen,Beinpresse,Ausfallschritte,Rumänisches Kreuzheben,Beinstrecker,Beinbeuger,Bulgarian Split Squats,Hackenschmidt-Kniebeuge,Adduktoren-Maschine,Abduktoren-Maschine;Waden:Wadenheben stehend,Wadenheben sitzend,Wadenheben an der Beinpresse;Bauch:Crunches,Plank,Beinheben hängend,Russian Twists,Bauchroller,Seitlicher Unterarmstütz,Sit-ups,Fahrrad-Crunches,Cable Crunches;Nacken:Nackenheben,Shrugs mit Kurzhanteln,Shrugs mit Langhantel,Nacken-Isometrie;Gesäß:Hip Thrusts,Glute Bridge,Kabel-Kickbacks,Sumo-Kreuzheben,Step-ups,Good Mornings'
.split(';').forEach(function(p){var a=p.split(':');a[1].split(',').forEach(function(n){BUILT.push({n:n,g:[a[0]]})})});
try{NET=JSON.parse(localStorage.getItem('ascending-ex2'))}catch(e){}
var MAPG={abdominals:'Bauch','lower back':'Rücken','middle back':'Rücken',lats:'Rücken',neck:'Nacken',traps:'Nacken',shoulders:'Schulter',triceps:'Trizeps',biceps:'Bizeps',forearms:'Bizeps',quadriceps:'Beine',hamstrings:'Beine',abductors:'Beine',adductors:'Beine',calves:'Waden',chest:'Brust',glutes:'Gesäß'};
function loadEx(){
  if(NET||exState)return;
  exState='lädt';
  fetch('https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json').then(function(r){return r.json()}).then(function(j){
    NET=j.map(function(e){var g=[];(e.primaryMuscles||[]).forEach(function(m){var x=MAPG[m];if(x&&g.indexOf(x)<0)g.push(x)});return{n:e.name,g:g,img:(e.images&&e.images[0])||''}}).filter(function(e){return e.g.length});
    try{localStorage.setItem('ascending-ex2',JSON.stringify(NET))}catch(e){}
    exState='';if(view.n==='wlib')render();
  }).catch(function(){exState='offline';if(view.n==='wlib')render()});
}

var EXD=`Brust|Bankdrücken|Barbell Bench Press|Flach auf die Bank legen, Schulterblätter zusammenziehen. Stange kontrolliert zur Brust senken und kraftvoll nach oben drücken.
Brust|Schrägbankdrücken|Incline Barbell Bench Press|Bank auf 30 bis 45 Grad stellen. Stange zur oberen Brust senken und hochdrücken, Ellbogen leicht angewinkelt.
Brust|Negativbankdrücken|Decline Barbell Bench Press|Auf der Negativbank Stange zur unteren Brust senken und nach oben drücken. Trifft den unteren Brustbereich.
Brust|Kurzhantel-Bankdrücken|Dumbbell Bench Press|Mit je einer Kurzhantel flach liegen. Hanteln seitlich der Brust absenken und über der Brust zusammendrücken.
Brust|Schrägbank Kurzhantel|Incline Dumbbell Press|Auf der Schrägbank Kurzhanteln von der oberen Brust nach oben drücken, oben nicht ganz durchstrecken.
Brust|Negativbank Kurzhantel|Decline Dumbbell Press|Auf der Negativbank Kurzhanteln kontrolliert absenken und über der unteren Brust hochdrücken.
Brust|Fliegende|Dumbbell Flyes|Flach liegen, Arme leicht gebeugt seitlich öffnen bis die Brust gedehnt ist, dann im Bogen wieder zusammenführen.
Brust|Schrägbank Fliegende|Incline Dumbbell Flyes|Auf der Schrägbank die Hanteln im Bogen öffnen und über der oberen Brust zusammenführen.
Brust|Kabelzug-Fliegende|Cable Crossover|Am Kabelturm mit leicht gebeugten Armen die Griffe im Bogen vor der Brust zusammenführen, Brust anspannen.
Brust|Kabelzug von unten|Low Cable Crossover|Kabel unten einstellen, Griffe im Bogen nach oben vor das Gesicht führen. Trainiert die obere Brust.
Brust|Kabelzug von oben|High Cable Crossover|Kabel oben einstellen, Griffe nach unten vor den Bauch ziehen. Trainiert die untere Brust.
Brust|Liegestütze|Push-Up|Körper gerade wie ein Brett halten, Brust zum Boden senken und kraftvoll hochdrücken.
Brust|Liegestütze weit|Wide Push-Up|Hände weiter als schulterbreit aufsetzen und Liegestütze machen. Betont die äußere Brust.
Brust|Liegestütze eng|Close Grip Push-Up|Hände eng unter der Brust, Ellbogen nah am Körper. Beansprucht Trizeps und innere Brust.
Brust|Liegestütze erhöht|Decline Push-Up|Füße auf eine Erhöhung stellen und Liegestütze machen. Betont die obere Brust und Schulter.
Brust|Liegestütze auf Knien|Kneeling Push-Up|Wie ein normaler Liegestütz, aber die Knie bleiben am Boden. Gut für Anfänger.
Brust|Diamant-Liegestütze|Diamond Push-Up|Hände bilden unter der Brust eine Raute. Stark für Trizeps und innere Brust.
Brust|Dips (Brust)|Chest Dips|An Barren leicht nach vorn lehnen, Ellbogen nach außen, tief absenken und hochdrücken.

function home(){

    var a=i/NT*2*Math.PI-Math.PI/2,c=Math.cos(a),sn=Math.sin(a);
    ticks+='<line x1="'+(150+c*(R-10)).toFixed(1)+'" y1="'+(150+sn*(R-10)).toFixed(1)+'" x2="'+(150+c*R).toFixed(1)+'" y2="'+(150+sn*R).toFixed(1)+'" class="'+(i<n/GOAL()*NT?'on':'')+'"/>';
  }

  var st=pre?'Es geht in '+diff(s,t)+' Tagen los. Plane schon mal vor.':ts.length?'Heute: '+dn+' von '+ts.length+' erledigt':'Für heute ist noch nichts geplant';

  '<p class="status mut">'+st+'</p>'+

}
function cal(){
  var s=parse(S.start),t=today(),tk=key(t);

var MS=[1,3,7,14,30,60,90,180,365];
function dur(ms){var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);return d+(d===1?' Tag ':' Tage ')+h+' Std.'}
function durL(ms){var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);return d+(d===1?' Tag ':' Tagen ')+h+(h===1?' Stunde':' Stunden')}
function ab(){
  var top=bar()+'<h2>Abstinenz-Streak</h2>';
  if(!S.ab){
    var n=new Date(),v=n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())+'T'+pad(n.getHours())+':'+pad(n.getMinutes());
    return top+'<p class="mut">Wann soll dein Streak beginnen?</p><div class="card"><input type="datetime-local" id="abs" value="'+v+'" max="'+v+'" style="width:100%"><button class="btn big" data-act="abstart">Streak starten</button></div>';
  }
  var now=Date.now(),cur=now-S.ab.start,h=S.ab.h||[],lens=h.map(function(x){return x.e-x.s}),best=Math.max.apply(null,[cur].concat(lens)),days=Math.floor(cur/864e5),nx=0;
  for(var i=0;i<MS.length;i++){if(MS[i]>days){nx=MS[i];break}}
  var left=nx?Math.ceil((nx*864e5-cur)/864e5):0,pct=Math.min(100,cur/864e5/365*100);
  var avg=lens.length?dur(lens.reduce(function(a,b){return a+b},0)/lens.length):'–';
  return top+
  '<div class="card"><span class="mut sm">Aktueller Streak</span><div class="big-t">'+dur(cur)+'</div><p class="mut sm">Start: '+TF.format(new Date(S.ab.start))+'</p><p class="mut sm">Längster Streak: '+dur(best)+'</p></div>'+
  '<div class="card"><span class="mut sm">Fortschritt</span><div class="big-t">'+Math.min(days,365)+' / 365 Tage</div><div class="bar"><i style="width:'+pct+'%"></i></div>'+
  '<p class="mut sm">'+(nx?left+(left===1?' Tag':' Tage')+' bis zum nächsten Meilenstein ('+nx+' Tage)':'Alle Meilensteine erreicht')+'</p>'+
  '<div style="margin-top:8px">'+MS.map(function(m){return '<span class="ms'+(days>=m?' on':'')+'">'+m+'</span>'}).join('')+'</div><p class="mut sm">Meilensteine in Tagen</p></div>'+
  '<div class="sg">'+card('Durchschnittlicher Streak',avg)+card('Abgeschlossene Streaks',h.length)+card('Längster Streak',dur(best))+card('Zeit seit letztem Reset',h.length?dur(now-h[h.length-1].e):'Noch kein Reset')+'</div>'+
  '<button class="btn alt big" data-act="abreset">Streak zurücksetzen</button>';
}

  var ks=Object.keys(S.runs).sort(),n=ks.length;

  ks.forEach(function(k){var r=S.runs[k],d=parse(k);km+=r.km;sc+=r.s;best=Math.min(best,r.s/r.km);lg=Math.max(lg,r.km);if(d>=w0&&d<=add(w0,6))wk+=r.km;if(d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear())mo+=r.km});
  var sp=ks.map(function(k){var q=S.runs[k],t5=q.s*Math.pow(5/q.km,1.06);return 5/(t5/3600)}),tr='Ab 4 Läufen siehst du hier deinen Trend.';
  if(n>=4){
    var h=Math.floor(n/2),a=sp.slice(0,h),b=sp.slice(-h),av=function(x){return x.reduce(function(p,q){return p+q},0)/x.length},df=av(b)-av(a);
    tr=Math.abs(df)<0.1?'Dein Tempo ist etwa gleich geblieben.':'Im Schnitt bist du '+f1(Math.abs(df))+' km/h '+(df>0?'schneller':'langsamer')+' als am Anfang.';
  }
  return '<h3>Statistiken</h3><div class="sg">'+card('Läufe',n)+card('Gesamt',f1(km)+' km')+card('Ø pro Lauf',f1(km/n)+' km')+card('Ø Tempo',pf(sc/km)+' min/km')+card('Bestes Tempo',pf(best)+' min/km')+card('Längster Lauf',f1(lg)+' km')+card('Diese Woche',f1(wk)+' km')+card('Dieser Monat',f1(mo)+' km')+'</div>'+
  '<div class="card"><span class="mut sm">Leistungsverlauf (Tempo und Distanz, umgerechnet auf 5 km in km/h). Steigt die Linie, wirst du besser.</span>'+lineT(sp.slice(-30),null,false)+'<p class="mut sm">'+tr+'</p></div>';
}

/* ---------- Kalender & Tage der Tracker ---------- */
function cal2(s){
  var fn,leg;
  if(s==='st'){fn=function(k){return S.st[k]!=null?'run':''};leg='Blau = Bildschirmzeit eingetragen'}
  else if(s==='run'){fn=function(k){var ts=(S.days[k]||[]).filter(function(x){return x.src==='run'});return S.runs[k]?'run':ts.length?'has':''};leg='Blau = gelaufen, Punkt = Lauf geplant'}
  else if(s==='wo'){fn=function(k){var ts=(S.days[k]||[]).filter(function(x){return x.src==='wo'});return S.wo.logs.some(function(l){return l.k===k})?'done':ts.length?'has':''};leg='Grün = trainiert, Punkt = Workout geplant'}
  else if(s==='nail'){fn=function(k){return S.nail[k]>0?'run':''};leg='Blau = Tag mit Kauen, die Zahl steht im Tag'}
  else if(s==='food'){fn=function(k){return goalMet(k)?'done':(S.fd.log[k]||[]).length?'has':''};leg='Grün = Kalorienziel erreicht, Punkt = Einträge vorhanden'}
  else{fn=function(k){var ts=(S.days[k]||[]).filter(function(x){return x.src===s});return ts.length&&ts.every(function(x){return x.d})?'done':ts.length?'has':''};leg='Grün = alles erledigt, Punkt = geplant'}
  return bar(backTo('main',s))+'<h2>'+TT[s]+' · Kalender</h2><p class="mut sm">'+leg+'</p>'+grid(fn,'day2',s);
}
function day2(){
  var s=view.s,k=view.k,d=parse(k),t=today(),past=d<t,isT=k===key(t),fut=d>t,out=bar(backTo('cal2',s,'Kalender'))+'<h2>'+DF.format(d)+'</h2>';
  if(s==='food')return fday(k);
  if(s==='nail')return out+(fut?'<p class="mut">Für kommende Tage kann nichts eingetragen werden.</p>':nailBox(k));
  if(s==='st')return out+(fut?'<p class="mut">Für kommende Tage kann noch keine Bildschirmzeit eingetragen werden.</p>':stForm(k));
  if(s==='run')return out+(fut?'':runForm(k))+'<h3>Geplant</h3>'+list(k,!past,isT,'run')+(past?'':adder(k,'run'));
  if(s==='wo'){
    var L=S.wo.logs.filter(function(l){return l.k===k});
    return out+'<h3>Geplant</h3>'+list(k,!past,isT,'wo')+(past?'':adder(k,'wo'))+(L.length?'<h3>Absolviert</h3>'+L.map(function(l){return '<div class="card"><b>'+esc(l.name)+'</b>'+l.ex.map(function(e){return '<p class="mut sm"><span style="color:var(--fg)">'+esc(e.n)+'</span><br>'+e.sets.map(function(x){return x.w+' kg × '+x.r}).join(' · ')+'</p>'}).join('')+'</div>'}).join(''):'');
  }
  return out+list(k,!past,isT,s)+(past?'':adder(k,s));

function mkTask(k,title,tm,rep,src){

  if(!rep){(S.days[k]=S.days[k]||[]).push({t:title,d:false,tm:tm||undefined,src:src||undefined})}
  else{
    var r={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:title,from:k,skip:[],src:src||undefined,tm:tm||undefined,type:rep.type};
    if(rep.type==='wd')r.days=rep.days;else r.n=rep.n;
    S.rec.push(r);
  }
  save();render();return true;
}
var STOP=['hake','haken','hak','markiere','markier','meine','meinen','mein','meiner','aufgabe','aufgaben','als','erledigt','abgeschlossen','fertig','ab','die','der','das','den','dem','bitte','bjarne','und','mal','heute','morgen','to-do','todo','liste','lösche','lösch','entferne','entfern','ändere','ändern','uhrzeit','zeit','auf','uhr','verschiebe','verschieb','setze','setz','nächsten','nächste','nächstes','meines','meiner'];
function score(x,q){
  var l=q.toLowerCase(),s=0;
  if(/workout|training/.test(l)&&x.src==='wo')s+=3;
  if(/\blauf|joggen/.test(l)&&x.src==='run')s+=3;
  if(/\bbox/.test(l)&&x.src==='box')s+=3;
  var tl=x.t.toLowerCase();
  l.replace(/[^a-zäöüß0-9 -]/g,' ').split(/\s+/).forEach(function(w){if(w.length>=3&&STOP.indexOf(w)<0){var st=w.replace(/(en|er|e|s|n)$/,'');if(tl.indexOf(w)>-1||(st.length>=4&&tl.indexOf(st)>-1))s+=2}});
  return s;
}
function findTasks(q,k,openOnly){
  var out=[];
  (S.days[k]||[]).forEach(function(x,i){
    if(x.auto||(openOnly&&x.d))return;
    var s=q?score(x,q):1;if(s>0)out.push({x:x,i:i,k:k,s:s});
  });
  return out.sort(function(a,b){return b.s-a.s});
}
function findUpcoming(q,openOnly){
  for(var n=0;n<=30;n++){var k=key(add(today(),n)),r=findTasks(q,k,openOnly);if(r.length&&r[0].s>0)return r}
  return [];
}
function fmtList(k,only){
  var a=(S.days[k]||[]).filter(function(x){return !only||!x.d});
  return a.map(function(x){return (x.tm?x.tm+' Uhr: ':'')+x.t+(x.d?' (erledigt)':'')}).join('\n');
}
function removeTask(r){
  var x=r.x;
  if(x.r){var rc=S.rec.filter(function(y){return y.id===x.r})[0];if(rc)rc.skip.push(r.k)}
  S.days[r.k].splice(r.i,1);save();render();
}
function DFk(k){return DF.format(parse(k))}

/* Lokaler Modus ohne KI */
function localHandle(t){
  var l=t.toLowerCase(),w=parseWhen(t),tm=parseTime(t),m;
  if(/was kannst du|hilfe|was machst du/.test(l))return 'Ich kann Bereiche öffnen, Aufgaben anlegen (auch wiederholt), abhaken, auflisten, löschen und Uhrzeiten ändern. Für allgemeine Fragen und Wochenpläne brauche ich die KI-Anbindung (⚙ im Chat).';
  if(/\b(zwei|drei|vier|fünf|sechs|sieben|\d+)\s+(aufgaben|workouts)/.test(l))return 'Mehrere Aufgaben oder Wochenpläne auf einmal kann ich nur mit der KI-Anbindung (⚙). Sag mir die Aufgaben bitte einzeln.';
  if(/(lösch|entfern)/.test(l)){
    var r=findTasks(l,w.k,false);
    if(!r.length||r[0].s<1)return 'Welche Aufgabe soll ich löschen? Nenne sie bitte genauer.';
    var c=r[0];
    Bj.pend=function(a){if(/^\s*(ja|jo|jep|klar|mach|bestätig|ok)/i.test(a)){removeTask(c);return 'Gelöscht: '+c.x.t+'.'}return 'Okay, ich habe nichts gelöscht.'};
    return 'Soll ich „'+c.x.t+'“ wirklich löschen? Sag Ja oder Nein.';
  }
  if(tm&&/(uhrzeit|verschieb|änder|setz|zeit)/.test(l)){
    var u=w.f?findTasks(l,w.k,true):findUpcoming(l,true);
    if(!u.length||u[0].s<1)return 'Welche Aufgabe meinst du? Nenne sie bitte genauer.';
    u[0].x.tm=tm;save();render();return '„'+u[0].x.t+'“ ('+DFk(u[0].k)+') ist jetzt auf '+tm+' Uhr gelegt.';
  }
  if(/(hak|markier|erledigt|abgeschlossen|fertig)/.test(l)&&/(\bab\b|als |erledigt|abgeschlossen|fertig)/.test(l)){
    var o=findTasks(l,w.k,true),all=findTasks('',w.k,true);
    var pick=o.length&&o[0].s>1?o[0]:(all.length===1?all[0]:null);
    if(!pick)return all.length?'Welche Aufgabe meinst du?\n'+fmtList(w.k,true):'Es gibt keine offene Aufgabe für '+DFk(w.k)+'.';
    pick.x.d=true;save();render();return '„'+pick.x.t+'“ ist abgehakt.';
  }
  if(/(trag|erstell|füg|leg|ergänz|notier|hinzu)/.test(l)&&/(aufgabe|to-?do|liste|workout|eintrag)/.test(l)){
    var title=cleanTitle(t),rep=parseRepeat(t);
    var go=function(ti){
      if(parse(w.k)<today())return 'Das Datum liegt in der Vergangenheit.';
      mkTask(w.k,ti,tm,rep,'');
      return 'Erledigt: „'+ti+'“ steht '+(rep?(rep.type==='every'?(rep.n===1?'jeden Tag':'alle '+rep.n+' Tage'):'wöchentlich'):'am '+DFk(w.k))+(tm?' um '+tm+' Uhr':'')+' in deiner To-do-Liste.'+(w.f||rep?'':' (Ich habe heute angenommen, weil du kein Datum genannt hast.)');
    };
    if(!title){Bj.pend=function(a){return go(a.trim().charAt(0).toUpperCase()+a.trim().slice(1))};return 'Wie soll die Aufgabe heißen?'}
    return go(title);
  }
  if(/(offene|was steht|was muss ich|anstehend|was habe ich)/.test(l)){
    var s=fmtList(w.k,true);return s?'Offen für '+DFk(w.k)+':\n'+s:'Für '+DFk(w.k)+' ist nichts offen.';
  }
  var nk=null;NAVS.some(function(n){if(n[0].test(l)){nk=n[1];return true}});
  if(nk&&/(öffne|öffnen|geh|zeig|wechsel|navigier|bring|zurück|zu meinen|zu meinem|bereich|tracker)/.test(l)){var lab=goNav(nk);return 'Okay, ich öffne '+lab+'.'}
  if(/(streak|serie|tage in folge)/.test(l))return 'Deine To-do-Serie liegt bei '+streak()+' von '+GOAL()+' Tagen.';
  return 'Das habe ich nicht verstanden. Sag zum Beispiel „Öffne Workout“ oder „Trage morgen um 17 Uhr Workout ein“. Für allgemeine Fragen richte die KI-Anbindung ein (⚙ im Chat).';
}

/* KI-Modus über deinen Server */
var TOOLS=[
{name:'navigate',description:'Öffnet einen Bereich der App.',input_schema:{type:'object',properties:{target:{type:'string',enum:Object.keys(TARGETS)}},required:['target']}},
{name:'create_task',description:'Legt eine Aufgabe an (optional mit Uhrzeit und Wiederholung). Kategorie steuert, in welchem Tracker sie erscheint.',input_schema:{type:'object',properties:{title:{type:'string'},date:{type:'string',description:'YYYY-MM-DD, Standard heute'},time:{type:'string',description:'HH:MM'},category:{type:'string',enum:['todo','run','box','skin','supp']},repeat:{type:'object',properties:{type:{type:'string',enum:['daily','every','weekdays']},n:{type:'integer'},days:{type:'array',items:{type:'integer'},description:'0=Sonntag bis 6=Samstag'}},required:['type']}},required:['title']}},
{name:'complete_task',description:'Hakt eine Aufgabe als erledigt ab.',input_schema:{type:'object',properties:{query:{type:'string'},date:{type:'string'}},required:['query']}},
{name:'list_tasks',description:'Listet die Aufgaben eines Tages.',input_schema:{type:'object',properties:{date:{type:'string'},only_open:{type:'boolean'}}}},
{name:'delete_task',description:'Löscht eine Aufgabe. Nur mit confirmed=true aufrufen, nachdem der Nutzer das Löschen ausdrücklich bestätigt hat.',input_schema:{type:'object',properties:{query:{type:'string'},date:{type:'string'},confirmed:{type:'boolean'}},required:['query','confirmed']}},
{name:'set_task_time',description:'Ändert die Uhrzeit einer Aufgabe. Ohne Datum wird die nächste passende offene Aufgabe verwendet.',input_schema:{type:'object',properties:{query:{type:'string'},time:{type:'string'},date:{type:'string'}},required:['query','time']}},
{name:'get_status',description:'Liefert die To-do-Serie und die heutigen Aufgaben.',input_schema:{type:'object',properties:{}}}];
function okDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d||'')?d:key(today())}
function execTool(n,i){
  try{
    i=i||{};
    if(n==='navigate')return goNav(i.target)?'Geöffnet: '+i.target:'Unbekanntes Ziel';
    if(n==='create_task'){
      var k=okDate(i.date),rep=null,src={todo:'',run:'run',box:'box',skin:'skin',supp:'supp'}[i.category||'todo']||'';
      if(parse(k)<today())return 'Fehler: Das Datum liegt in der Vergangenheit.';
      if(i.repeat){var r=i.repeat;rep=r.type==='weekdays'?{type:'wd',days:(r.days&&r.days.length?r.days:[parse(k).getDay()])}:{type:'every',n:r.type==='daily'?1:Math.max(1,r.n||2)}}
      var tm=/^\d{2}:\d{2}$/.test(i.time||'')?i.time:'';
      return mkTask(k,i.title,tm,rep,src)?'Angelegt: '+i.title+' ('+k+(tm?' '+tm:'')+(rep?', wiederholt':'')+')':'Fehler: Titel fehlt.';
    }
    if(n==='complete_task'){
      var d=okDate(i.date),f=findTasks(i.query,d,true);
      if(!f.length)return 'Keine passende offene Aufgabe am '+d;
      if(f.length>1&&f[0].s===f[1].s)return 'Mehrdeutig, bitte nachfragen. Kandidaten: '+f.map(function(y){return y.x.t}).join('; ');
      f[0].x.d=true;save();render();return 'Abgehakt: '+f[0].x.t;
    }
    if(n==='list_tasks'){var dd=okDate(i.date),s=fmtList(dd,i.only_open);return s?'Aufgaben am '+dd+':\n'+s:'Keine Aufgaben am '+dd}
    if(n==='delete_task'){
      if(!i.confirmed)return 'Nicht gelöscht: Frage zuerst den Nutzer nach Bestätigung.';
      var dl=i.date?findTasks(i.query,okDate(i.date),false):findUpcoming(i.query,false);
      if(!dl.length)return 'Keine passende Aufgabe gefunden.';
      removeTask(dl[0]);return 'Gelöscht: '+dl[0].x.t;
    }
    if(n==='set_task_time'){
      if(!/^\d{2}:\d{2}$/.test(i.time||''))return 'Fehler: Uhrzeit im Format HH:MM nötig.';
      var st=i.date?findTasks(i.query,okDate(i.date),true):findUpcoming(i.query,true);
      if(!st.length)return 'Keine passende offene Aufgabe gefunden.';
      st[0].x.tm=i.time;save();render();return 'Uhrzeit gesetzt: '+st[0].x.t+' ('+st[0].k+') um '+i.time;
    }
    if(n==='get_status'){var tk=key(today()),a=S.days[tk]||[];return JSON.stringify({todoSerieTage:streak(),von:GOAL(),heute:{offen:a.filter(function(x){return !x.d}).length,erledigt:a.filter(function(x){return x.d}).length}})}
  }catch(e){return 'Fehler: '+e.message}
  return 'Unbekanntes Werkzeug';
}
function sysPrompt(){
  var n=new Date();
  return 'Du bist Bjarne, der persönliche Sprachassistent in der Web-App „Ascending“ des Nutzers. Antworte immer auf Deutsch, kurz und natürlich (meist 1 bis 3 Sätze), weil deine Antworten oft vorgelesen werden. Keine Markdown-Formatierung und keine Emojis.\nHeute ist '+DF.format(n)+' '+n.getFullYear()+', '+pad(n.getHours())+':'+pad(n.getMinutes())+' Uhr (Datum '+key(n)+').\nDeine Aufgaben: 1) die App bedienen (Bereiche öffnen), 2) Daten in der App tatsächlich ändern (Aufgaben anlegen, abhaken, auflisten, löschen, Uhrzeiten ändern) und 3) allgemeine Fragen zu beliebigen Themen direkt beantworten, ohne auf die App zu verweisen.\nBereiche: To-do-Kalender, To-do-Statistiken, Woche planen, Bildschirmzeit, Workout, Laufen, Face Ascend, Box-Tracker, Ernährung, Supplements, Minispiel, Abstinenz-Streak.\nRegeln: Behaupte nie, etwas getan zu haben, ohne das passende Werkzeug aufzurufen. Frage bei fehlenden Angaben nach. Lösche nur nach ausdrücklicher Bestätigung des Nutzers in diesem Gespräch. Gib Daten an Werkzeuge als YYYY-MM-DD und HH:MM weiter. Für mehrere Tage (z. B. Wochenplan) lege pro Tag eine eigene Aufgabe an, nachdem die nötigen Angaben geklärt sind. Erfinde keine Fakten, nenne Unsicherheiten und nutze für aktuelle Informationen die Websuche, falls verfügbar. Bei Gesundheitsfragen gib allgemeine Hinweise und empfehle bei Bedarf ärztlichen Rat.';
}
function trimHist(){
  while(Bj.hist.length>30){
    Bj.hist.shift();
    while(Bj.hist.length&&!(Bj.hist[0].role==='user'&&typeof Bj.hist[0].content==='string'))Bj.hist.shift();
  }
}
async function askAI(text){
  var start=Bj.hist.length;
  Bj.hist.push({role:'user',content:text});trimHist();
  try{
    for(var step=0;step<7;step++){
      var res=await fetch(S.bj.url,{method:'POST',headers:{'content-type':'application/json','x-app-token':S.bj.token},body:JSON.stringify({system:sysPrompt(),messages:Bj.hist,tools:TOOLS})});
      if(!res.ok)throw new Error(res.status===403?'Zugriff verweigert (Passwort oder Adresse prüfen)':'Server-Fehler '+res.status);
      var data=await res.json();
      Bj.hist.push({role:'assistant',content:data.content});
      var uses=data.content.filter(function(c){return c.type==='tool_use'});
      if(data.stop_reason==='tool_use'&&uses.length){
        Bj.hist.push({role:'user',content:uses.map(function(u){return{type:'tool_result',tool_use_id:u.id,content:execTool(u.name,u.input)}})});
        continue;
      }
      if(data.stop_reason==='pause_turn')continue;
      return data.content.filter(function(c){return c.type==='text'}).map(function(c){return c.text}).join(' ').trim()||'Erledigt.';
    }
    return 'Das hat zu lange gedauert. Versuch es bitte noch einmal.';
  }catch(e){Bj.hist.length=start;throw e}
}

function bjStatus(t){

  var f=$('bjf');if(f){f.classList.toggle('on',!!S.bj.wake&&Bj.mode==='wake');f.classList.toggle('hot',Bj.state==='cmd'||Bj.mode==='once')}
}
function idleStatus(){return S.bj.wake&&Bj.mode==='wake'?'Hört auf „Bjarne“':(S.bj.url?'KI verbunden':'Lokaler Modus (ohne KI)')}

function fillVoices(){
  var sel=$('bjvoice');if(!sel||!window.speechSynthesis)return;
  var all=speechSynthesis.getVoices(),de=all.filter(function(v){return /^de/i.test(v.lang)}),l=de.length?de:all;
  sel.innerHTML='<option value="">Automatisch (deutsch)</option>'+l.map(function(v){return '<option value="'+esc(v.voiceURI)+'">'+esc(v.name)+' ('+v.lang+')</option>'}).join('');
  sel.value=S.bj.voice||'';
}
function speak(text){
  if(!S.bj.tts||!window.speechSynthesis)return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(text).replace(/[*#_`]/g,'')),vs=speechSynthesis.getVoices(),v=(S.bj.voice&&vs.filter(function(x){return x.voiceURI===S.bj.voice})[0])||vs.filter(function(x){return /^de/i.test(x.lang)})[0];
    u.lang='de-DE';if(v)u.voice=v;u.rate=+S.bj.rate||1;u.pitch=+S.bj.pitch||1;
    Bj.speaking=true;if(Bj.mode==='wake')stopRec();
    var done=function(){Bj.speaking=false;if(S.bj.wake&&!Bj.blocked)startRec('wake')};
    u.onend=done;u.onerror=done;speechSynthesis.speak(u);
  }catch(e){Bj.speaking=false}
}
function bjSay(text){bjMsg('bot',text);speak(text)}
function stopRec(){
  var r=Bj.rec;Bj.rec=null;Bj.mode='';
  if(r){r.onend=null;r.onerror=null;r.onresult=null;try{r.abort()}catch(e){}}
}
function startRec(mode){
  if(!SRC){bjStatus('Sprache wird hier nicht unterstützt. Nutze den Chat.');return}
  stopRec();
  var r=new SRC();r.lang='de-DE';r.continuous=mode==='wake';r.interimResults=true;r.maxAlternatives=1;
  Bj.rec=r;Bj.mode=mode;
  r.onresult=function(e){
    Bj.fails=0;
    for(var i=e.resultIndex;i<e.results.length;i++){
      var res=e.results[i],txt=res[0].transcript.trim();
      if(!res.isFinal){if(Bj.mode==='wake'&&Bj.state!=='cmd'&&WAKE.test(txt))bjStatus('Bjarne erkannt …');continue}
      onSpeech(txt);
    }
  };
  r.onerror=function(e){
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      Bj.blocked=true;S.bj.wake=false;save();stopRec();bjUI();
      bjSay('Der Browser erlaubt das Mikrofon nicht. Erlaube es in den Einstellungen oder schreibe mir im Chat.');
    }
  };
  r.onend=function(){
    if(Bj.rec!==r)return;
    var was=Bj.mode;Bj.rec=null;Bj.mode='';
    if(Bj.speaking)return;
    if(was==='wake'&&S.bj.wake&&!Bj.blocked){
      Bj.fails++;
      if(Bj.fails>8){S.bj.wake=false;save();bjUI();bjStatus('Zuhören beendet, der Browser blockiert es. Nutze den Mikrofonknopf.');return}
      setTimeout(function(){if(S.bj.wake&&!Bj.speaking&&!Bj.rec&&!Bj.blocked)startRec('wake')},Math.min(300*Bj.fails,3000));
    }else{
      bjUI();
      if(S.bj.wake&&!Bj.blocked&&!Bj.busy)startRec('wake');else bjStatus(idleStatus());
    }
  };
  try{r.start();bjStatus(mode==='wake'?'Hört auf „Bjarne“':'Ich höre zu …');bjUI()}catch(e){Bj.rec=null;Bj.mode=''}
}
function onSpeech(txt){
  if(Bj.mode==='once'){stopRec();sendUser(txt);return}
  if(Bj.state==='cmd'){clearTimeout(Bj.timer);Bj.state='';sendUser(txt);return}
  var m=txt.match(WAKE);if(!m)return;
  var after=txt.slice(txt.toLowerCase().indexOf(m[1].toLowerCase())+m[1].length).replace(/^[\s,.:!?-]+/,'');
  if(after.length>2)sendUser(after);
  else{
    Bj.state='cmd';bjStatus('Ich höre zu …');
    Bj.timer=setTimeout(function(){Bj.state='';bjStatus(idleStatus())},8000);
  }
}
async function sendUser(text){
  text=text.trim();if(!text||Bj.busy)return;
  if(!Bj.open)bjOpen(true);
  bjMsg('me',text);Bj.busy=true;bjStatus('Denke nach …');
  var reply;
  try{
    if(Bj.pend){var p=Bj.pend;Bj.pend=null;reply=p(text)}
    else if(S.bj.url)reply=await askAI(text);
    else reply=localHandle(text);
  }catch(e){reply='Das hat nicht geklappt: '+e.message}
  Bj.busy=false;bjStatus(idleStatus());bjSay(reply);
}

  $('bjf').onclick=function(){bjOpen(true)};

  $('bjg').onclick=function(){var s=$('bjset');s.hidden=!s.hidden;$('bju').value=S.bj.url;$('bjt').value=S.bj.token;fillVoices();$('bjrate').value=S.bj.rate||1;$('bjpitch').value=S.bj.pitch||1};
  if(window.speechSynthesis)speechSynthesis.onvoiceschanged=fillVoices;
  $('bjvoice').onchange=function(){S.bj.voice=this.value;save()};
  $('bjrate').oninput=function(){S.bj.rate=+this.value;save()};
  $('bjpitch').oninput=function(){S.bj.pitch=+this.value;save()};
  $('bjtest').onclick=function(){var t=S.bj.tts;S.bj.tts=true;speak('Hallo, ich bin Bjarne. So klinge ich jetzt.');S.bj.tts=t};
  $('bjsave').onclick=function(){S.bj.url=$('bju').value.trim();S.bj.token=$('bjt').value.trim();save();Bj.hist=[];$('bjset').hidden=true;bjStatus(idleStatus());bjMsg('bot',S.bj.url?'KI-Anbindung gespeichert. Frag mich etwas!':'Lokaler Modus aktiv.')};
  $('bjv').onclick=function(){S.bj.tts=!S.bj.tts;if(!S.bj.tts&&window.speechSynthesis)speechSynthesis.cancel();save();bjUI()};
  $('bjw').onclick=function(){
    S.bj.wake=!S.bj.wake;Bj.blocked=false;Bj.fails=0;save();
    if(S.bj.wake){startRec('wake');bjMsg('bot','Ich höre jetzt auf „Bjarne“, solange die App offen ist und der Bildschirm an bleibt.')}
    else{stopRec();bjStatus(idleStatus())}
    bjUI();
  };
  $('bjm').onclick=function(){
    if(Bj.mode==='once'){stopRec();bjUI();bjStatus(idleStatus());if(S.bj.wake)startRec('wake');return}
    Bj.blocked=false;startRec('once');
  };
  var snd=function(){var i=$('bji'),v=i.value;i.value='';sendUser(v)};

bjInit();

/* ---------- Menü, Rendern ---------- */
function sec(){var n=view.n;if(n==='slex'||n==='vit'||n==='nutd')return 'supp';if(n==='ab'||n==='stats'||n==='game'||n==='vis')return n;if(view.s)return view.s;if(['fset','fadd','fpick'].indexOf(n)>-1)return 'food';if(['wplan','wlib','wex','wgo','wstats'].indexOf(n)>-1)return 'wo';return 'td'}
var MENU=[['td','To-do-Kalender','home'],['stats','To-do-Statistiken','stats'],['ab','Abstinenz-Streak','ab'],['st','Bildschirmzeit','main:st'],['wo','Workout','main:wo'],['run','Laufen','main:run'],['nail','Nägelkauen','main:nail'],['skin','Face Ascend','main:skin'],['box','Box-Tracker','main:box'],['food','Ernährung','main:food'],['supp','Supplements','main:supp'],['game','Minispiel','game']];
function visv(){
  return bar(backTo('home','','Zurück'))+'<h2>Tracker anzeigen</h2><p class="mut sm">Ausgeblendete Tracker verschwinden nur aus dem Menü. Deine Daten bleiben erhalten.</p><ul>'+
  MENU.filter(function(m){return m[0]!=='td'&&m[0]!=='stats'}).map(function(m){
    return '<li><span>'+m[1]+'</span><button class="back" data-act="vis" data-s="'+m[0]+'">'+(S.hide[m[0]]?'Einblenden':'Ausblenden')+'</button></li>';
  }).join('')+'</ul>';
}
function layer(){
  var h='';
  if(menu){
    var c=sec();
    h+='<div class="scrim" data-act="menuclose"></div><nav class="drawer"><p class="dt">Ascending</p>'+
    MENU.filter(function(m){return !S.hide[m[0]]}).concat([['vis','⚙ Tracker ein-/ausblenden','vis']]).map(function(m){
      return '<button class="mi'+(c===m[0]?' on':'')+'" data-act="nav" data-v="'+m[2]+'">'+m[1]+'</button>';
    }).join('')+'</nav>';
  }
  if(modal&&S.ab){
    h+='<div class="scrim m" data-act="mclose"></div><div class="modal" role="dialog"><h3>Bist du sicher?</h3><p class="mut">Dein aktueller Streak von '+durL(Date.now()-S.ab.start)+' wird beendet.</p><div class="row" style="margin-top:16px"><button class="btn alt" data-act="mclose">Abbrechen</button><button class="btn" data-act="mdo">Zurücksetzen</button></div></div>';
  }
  $('layer').innerHTML=h;
}
function tick(){
  var e=$('tm');if(!e||!tmEnd)return;
  var r=Math.ceil((tmEnd-Date.now())/1000);
  if(r<=0){tmEnd=0;e.textContent='Pause vorbei!';try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(x){}}
  else e.textContent='Pause '+Math.floor(r/60)+':'+pad(r%60);
}
function render(){
  check();
  if(view.n==='wgo'&&!S.ws)view={n:'main',s:'wo'};
  var v=view.n,h=v==='cal'?cal():v==='day'?day(view.k):v==='week'?week():v==='stats'?stats():v==='ab'?ab():v==='main'?mainv():v==='cal2'?cal2(view.s):v==='day2'?day2():v==='wplan'?wplan():v==='wlib'?wlib():v==='wex'?wex():v==='wgo'?wgo():v==='wstats'?wstats():v==='fset'?fset():v==='fadd'?fadd():v==='fpick'?fpick():v==='game'?gamev():v==='vis'?visv():v==='slex'?slexv():v==='vit'?vitv():v==='nutd'?nutd():home();
  $('app').innerHTML=h;
  layer();tick();bjSync();
  if(focusKey){var e=$('in-'+focusKey);if(e)e.focus();focusKey=null}
}

/* ---------- Aktionen ---------- */
function addTask(k,src){
  src=src||'';
  var v='',ref;
  if(src==='wo'){var sel=$('wp-'+k),p=sel&&planById(sel.value);if(p){v=p.name;ref=p.id}}
  else{var el=$('in-'+k);v=el?el.value.trim():'';if(!v)v=DEF[src]||''}
  if(v){
    var ty=$('rt-'+k).value;
    if(ty==='once'){(S.days[k]=S.days[k]||[]).push({t:v,d:false,src:src||undefined,ref:ref})}
    else{
      var r={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:v,from:k,skip:[],src:src||undefined,ref:ref};
      if(ty==='wd'){
        r.type='wd';
        r.days=[].slice.call(document.querySelectorAll('#rw-'+k+' input:checked')).map(function(x){return +x.value});
        if(!r.days.length)r.days=[parse(k).getDay()];
      }else{
        r.type='every';
        r.n=ty==='daily'?1:Math.max(1,Math.min(365,Math.round(+$('rn-'+k).value)||2));
      }
      S.rec.push(r);
    }
    save();
  }
  focusKey=k;
}
function markDone(k,src,ref,title){
  var a=S.days[k]=S.days[k]||[],f=false;
  a.forEach(function(x){if(x.src===src&&(!ref||x.ref===ref)){x.d=true;f=true}});
  if(!f)a.push({t:title,d:true,src:src,ref:ref||undefined});
}
function startWo(k,pid){
  var p=planById(pid);if(!p)return;
  S.ws={k:k,pid:pid,name:p.name,exs:p.exs.map(function(e){
    var last=null,pr=S.wo.pr[e.n];
    S.wo.logs.forEach(function(l){l.ex.forEach(function(x){if(x.n===e.n&&x.sets.length)last=x.sets[x.sets.length-1].w})});
    var w=last!=null?last:pr?pr.w:'',sets=[];
    for(var i=0;i<e.s;i++)sets.push({w:w,r:e.r,d:false});
    return{n:e.n,sets:sets};
  })};
  view={n:'wgo'};tmEnd=0;save();
}
function finishWo(){
  var w=S.ws,ex=[];
  w.exs.forEach(function(e){
    var sets=e.sets.filter(function(s){return s.d&&+s.r>0}).map(function(s){return{w:+s.w||0,r:+s.r}});
    if(sets.length)ex.push({n:e.n,sets:sets});
  });
  if(!ex.length){alert('Hake mindestens einen Satz ab.');return false}
  S.wo.logs.push({k:w.k,pid:w.pid,name:w.name,ex:ex});
  ex.forEach(function(e){e.sets.forEach(function(s){if(better(s,S.wo.pr[e.n]))S.wo.pr[e.n]={w:s.w,r:s.r}})});
  markDone(w.k,'wo',w.pid,w.name);
  view={n:'day2',s:'wo',k:w.k};S.ws=null;tmEnd=0;save();
  return true;
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  var D=b.dataset,a=D.act,k=D.k,i=+D.i,nav=true,s=D.s;
  if(a==='home')view={n:'home'};
  else if(a==='cal')view={n:'cal'};
  else if(a==='day')view={n:'day',k:k};
  else if(a==='week')view={n:'week'};
  else if(a==='stats')view={n:'stats'};
  else if(a==='weekdone'){S.planned=key(today());save();view={n:'home'}}
  else if(a==='menu'){menu=true;nav=false}
  else if(a==='menuclose'){menu=false;nav=false}
  else if(a==='nav'){
    var v=D.v;menu=false;
    if(v.indexOf('main:')===0){view={n:'main',s:v.slice(5)};if(v==='main:wo')loadEx()}else view={n:v};
  }
  else if(a==='slex'){view={n:'slex'}}
  else if(a==='vit'){view={n:'vit'}}
  else if(a==='nutd'){view={n:'nutd',x:D.id}}
  else if(a==='main')view={n:'main',s:s};
  else if(a==='cal2')view={n:'cal2',s:s};
  else if(a==='day2')view={n:'day2',s:s,k:k};
  else if(a==='toggle'){S.days[k][i].d=!S.days[k][i].d;save();nav=false}
  else if(a==='del'){
    var x=S.days[k][i];
    if(x.r){var r=S.rec.filter(function(y){return y.id===x.r})[0];if(r)r.skip.push(k)}
    S.days[k].splice(i,1);save();nav=false;
  }
  else if(a==='endrec'){
    nav=false;
    if(confirm('Diese Wiederholung für alle kommenden Tage beenden?')){
      var id=D.r,tk=key(today());
      S.rec=S.rec.filter(function(y){return y.id!==id});
      for(var d in S.days){if(d>=tk)S.days[d]=S.days[d].filter(function(y){return y.r!==id||y.d})}
      save();
    }
  }
  else if(a==='add'){addTask(k,s);nav=false}
  else if(a==='vis'){nav=false;S.hide[s]=!S.hide[s];save()}
  else if(a==='setgoal'){nav=false;var gv=Math.round(+$('gl').value);if(gv>=1&&gv<=3650){S.goal=gv;save()}else alert('Bitte ein Ziel zwischen 1 und 3650 Tagen eingeben.')}
  else if(a==='setstart'){nav=false;var sv=$('sd').value;if(sv&&sv>=key(today())){S.start=sv;save()}}
  else if(a==='abstart'){nav=false;var ms=new Date($('abs').value).getTime();if(!ms||ms>Date.now())ms=Date.now();S.ab={start:ms,h:[]};save()}
  else if(a==='abreset'){modal=true;nav=false}
  else if(a==='mclose'){modal=false;nav=false}
  else if(a==='mdo'){var n=Date.now();S.ab.h=S.ab.h||[];S.ab.h.push({s:S.ab.start,e:n});S.ab.start=n;save();modal=false;nav=false}
  else if(a==='stsave'){
    nav=false;var sh=$('sh').value,sm=$('sm').value;
    if(sh!==''||sm!==''){S.st[k]=Math.max(0,(+sh||0)*60+(+sm||0));save()}
  }
  else if(a==='stdel'){delete S.st[k];save();nav=false}
  else if(a==='runsave'){
    nav=false;var km=parseFloat($('rk').value.replace(',','.')),sc=(+$('rm').value||0)*60+(+$('rs').value||0);
    if(km>0&&sc>0){S.runs[k]={km:km,s:sc};markDone(k,'run','','Lauf');save()}else alert('Bitte km und Zeit eintragen.');
  }
  else if(a==='nailp'){nav=false;S.nail[k]=(S.nail[k]||0)+1;save()}
  else if(a==='nailm'){nav=false;S.nail[k]=Math.max(0,(S.nail[k]||0)-1);if(!S.nail[k])delete S.nail[k];save()}
  else if(a==='rundel'){delete S.runs[k];save();nav=false}
  else if(a==='wnew'){wb={id:null,name:'',exs:[]};view={n:'wplan'}}
  else if(a==='wedit'){var p=planById(D.id);wb={id:p.id,name:p.name,exs:p.exs.map(function(y){return{n:y.n,s:y.s,r:y.r}})};view={n:'wplan'}}
  else if(a==='wdelplan'){nav=false;if(confirm('Dieses Workout löschen? Es wird auch aus dem Kalender entfernt (ab heute).')){
    S.wo.plans=S.wo.plans.filter(function(y){return y.id!==D.id});
    S.rec=S.rec.filter(function(r){return !(r.src==='wo'&&r.ref===D.id)});
    var t0=key(today());
    Object.keys(S.days).forEach(function(dk){if(dk>=t0)S.days[dk]=S.days[dk].filter(function(x){return !(x.src==='wo'&&x.ref===D.id)})});
    save()}}
  else if(a==='wplan')view={n:'wplan'};
  else if(a==='wxdel'){wb.exs.splice(i,1);nav=false}
  else if(a==='wpick'){view={n:'wlib',pick:true};loadEx()}
  else if(a==='wlib'){view={n:'wlib'};loadEx()}
  else if(a==='wlibgo')view={n:'wlib'};
  else if(a==='wg'){libG=D.g;libQ='';nav=false}
  else if(a==='wrate'){nav=false;S.wo.rate=S.wo.rate||{};var rv=+D.v;if(S.wo.rate[D.n]===rv)delete S.wo.rate[D.n];else S.wo.rate[D.n]=rv;save()}
  else if(a==='wsel'){
    if(view.pick){wb.exs.push({n:D.n,s:3,r:10});view={n:'wplan'}}else{view={n:'wex',x:D.n};loadEx()};
  }
  else if(a==='wcustom'){
    nav=false;var cn=$('cn').value.trim();
    if(cn){S.wo.custom.push({n:cn,g:$('cg').value});save();libQ=cn.toLowerCase();libG=$('cg').value}
  }
  else if(a==='wimport'){
    nav=false;
    try{
      var arr=JSON.parse($('ci').value),c=0;
      arr.forEach(function(o){
        var n2=String(o.name||o.n||'').trim(),g=String(o.gruppe||o.g||'').trim(),gg=GR.filter(function(q){return q.toLowerCase()===g.toLowerCase()})[0];
        if(n2&&gg){S.wo.custom.push({n:n2,g:gg});c++}
      });
      save();alert(c+' Übungen importiert.');
    }catch(err){alert('Das Format passt nicht. Erwartet wird eine Liste wie [{"name":"Bankdrücken","gruppe":"Brust"}].')}
  }
  else if(a==='prsave'){
    nav=false;var pw=$('pw').value,pr=$('pr').value;
    if(pw!==''&&pr!==''){S.wo.pr[D.n]={w:+pw,r:+pr};save()}
  }
  else if(a==='wsave'){
    nav=false;
    if(!wb.name.trim()||!wb.exs.length){alert('Gib einen Namen ein und füge mindestens eine Übung hinzu.')}
    else{
      if(wb.id){var q=planById(wb.id);q.name=wb.name.trim();q.exs=wb.exs}
      else S.wo.plans.push({id:'p'+Date.now().toString(36),name:wb.name.trim(),exs:wb.exs});
      save();view={n:'main',s:'wo'};nav=true;
    }
  }
  else if(a==='wgo'){startWo(k,D.p)}
  else if(a==='wset'){
    nav=false;var st=S.ws.exs[+D.ei].sets[+D.si];st.d=!st.d;
    if(st.d)tmEnd=Date.now()+S.wo.rest*1000;else tmEnd=0;
    save();
  }
  else if(a==='wadd'){nav=false;var ee=S.ws.exs[+D.ei],ls=ee.sets[ee.sets.length-1];ee.sets.push({w:ls?ls.w:'',r:ls?ls.r:10,d:false});save()}
  else if(a==='wfinish'){nav=finishWo()}
  else if(a==='wcancel'){nav=false;if(confirm('Workout abbrechen? Die Eingaben gehen verloren.')){S.ws=null;tmEnd=0;save();view={n:'main',s:'wo'};nav=true}}
  else if(a==='tmp'){nav=false;if(tmEnd)tmEnd+=15000}
  else if(a==='tmm'){nav=false;if(tmEnd)tmEnd-=15000}
  else if(a==='tmstop'){nav=false;tmEnd=0;var te=$('tm');if(te)te.textContent='Pause bereit'}
  else if(a==='wstats')view={n:'wstats'};
  else if(a==='fset')view={n:'fset'};
  else if(a==='fadd'){fqs='';view={n:'fadd',k:k}}
  else if(a==='faddgo')view={n:'fadd',k:k};
  else if(a==='fback')view=k===key(today())?{n:'main',s:'food'}:{n:'day2',s:'food',k:k};
  else if(a==='fpick')view={n:'fpick',k:k,id:+D.id};
  else if(a==='fsave'){
    nav=false;var fo=allFoods()[view.id],gr=+$('fg').value;
    if(fo&&gr>0){var fk=gr/100;(S.fd.log[k]=S.fd.log[k]||[]).push({n:fo.n,g:gr,kcal:fo.kcal*fk,p:fo.p*fk,c:fo.c*fk,f:fo.f*fk});save();view=k===key(today())?{n:'main',s:'food'}:{n:'day2',s:'food',k:k};nav=true}
  }
  else if(a==='fdel'){S.fd.log[k].splice(i,1);save();nav=false}
  else if(a==='fcustom'){
    nav=false;var cfn=$('cfn').value.trim(),cfk=parseFloat($('cfk').value);
    if(cfn&&cfk>=0){S.fd.custom.push({n:cfn,kcal:cfk,p:+$('cfp').value||0,c:+$('cfc').value||0,f:+$('cff').value||0,g:100});save();fqs=cfn}else alert('Bitte Name und Kalorien pro 100 g eintragen.');
  }
  else if(a==='fmreset'){S.fd.macro=null;S.fd.pct=null;save()}
  else if(a==='gdur'){S.game.dur=+D.d;save();nav=false}
  else if(a==='gstart'){nav=false;gstart()}
  else if(a==='gclose'){nav=false;gclose()}
  render();
  if(nav)window.scrollTo(0,0);
});
document.addEventListener('keydown',function(e){

});
document.addEventListener('change',function(e){

else{S.ws=null;if(today().getDay()===0&&S.planned!==tk0)view={n:'week'}}
render();
